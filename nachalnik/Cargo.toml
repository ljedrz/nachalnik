[package]
name = "nachalnik"
version = "0.4.0"
description = "A minimal, transparent agent runtime: context, tools, permissions and execution as explicit, user-controllable state."
documentation = "https://docs.rs/nachalnik"
readme = "README.md"
categories = ["asynchronous", "development-tools"]
# note: five is the limit, so each one has to earn its place. `ai` and `llm` are the pair every
# crate in this corner of the registry is found by; `context` is what this one is actually about,
# and is how somebody looking for context management rather than for another SDK arrives.
keywords = ["agent", "llm", "ai", "context", "runtime"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# both features are off by default, and the documentation links into both of them; without this,
# docs.rs would build the default configuration and publish a page whose links do not resolve
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["lib"]

[features]
# The selector language (`tool:grep:latest`, `all:tool_results`, ...) used to name context
# items. It is a convenience for clients, not part of the runtime, so it is opt-in.
selectors = []
# Exposes the scripted provider, dummy tools and off-the-shelf permission policies used by
# this crate's own tests; useful for testing an agent built on top of the kernel without
# touching a real model provider.
test = []

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# `rt` only for `JoinSet`, and only reached when `Config::parallel_tool_calls` is on
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
nachalnik = { path = ".", features = ["selectors", "test"] } # a workaround to use these features in tests by default
# the provider the examples and the live suite talk through, and the environment they read it out
# of. Both are dev-dependencies and only ever dev-dependencies, so cargo strips them from the
# published manifest - which is what lets `nachalnik-utils` stay unpublished at 0.0.0.
#
# note: no version on either, deliberately, and that is what does the stripping: a dev-dependency
# carrying one is kept, and a kept one would mean this crate could not be packaged until
# `nachalnik-providers` was on the registry - which depends on *this* crate. The cycle is legal
# and cargo would resolve it, but it would make the two crates publishable only in one order for
# ever after, which is a lot to pay for a version number nobody reads.
nachalnik-providers = { path = "../nachalnik-providers" }
nachalnik-utils = { path = "../nachalnik-utils" }
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
