[package]
name = "nachalnik"
version = "0.9.0"
description = "A minimal, transparent agent runtime: context, tools, permissions and execution as explicit, user-controllable state."
documentation = "https://docs.rs/nachalnik"
readme = "README.md"
categories = ["asynchronous", "development-tools"]
# note: crates.io allows five. `ai` and `llm` are how crates like this are found; `context` is
# what this one is about, for people looking for context management rather than another SDK.
keywords = ["agent", "llm", "ai", "context", "runtime"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

# both features are off by default and the docs link to both, so docs.rs must build with them or
# the links break
[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["lib"]

[features]
# The selector language for naming context items (`tool:grep:latest`, `all:tool_results`, ...).
# A convenience for clients, not part of the runtime, so it is opt-in.
selectors = []
# The scripted provider, dummy tools and ready-made permission policies this crate's tests use;
# useful for testing an agent built on the kernel without a real model provider.
test = []

[dependencies]
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# `rt` only for `JoinSet`, used when `Config::parallel_tool_calls` is on
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
nachalnik = { path = ".", features = ["selectors", "test"] } # a workaround to use these features in tests by default
# the provider the examples and live tests use, and the helper that reads its settings from the
# environment. Dev-dependencies only, so cargo strips them from the published manifest, which lets
# `nachalnik-utils` stay unpublished at 0.0.0.
#
# note: deliberately unversioned, which is what makes cargo strip them. A versioned one would stay,
# and this crate couldn't be packaged until `nachalnik-providers` (which depends on this crate) was
# on the registry. Cargo allows that cycle, but it would force one publishing order forever.
nachalnik-providers = { path = "../nachalnik-providers" }
nachalnik-utils = { path = "../nachalnik-utils" }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
