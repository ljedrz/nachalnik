[package]
name = "nachalnik-mcp"
version = "0.12.0"
description = "Model Context Protocol (MCP) servers as tools for the nachalnik agent runtime: a tool somebody else wrote, as a Tool like any other."
documentation = "https://docs.rs/nachalnik-mcp"
readme = "README.md"
# `api-bindings` because it binds to other people's servers
categories = ["api-bindings", "asynchronous", "development-tools"]
# `nachalnik` so that searching for it lists all of this project's crates together
keywords = ["mcp", "agent", "llm", "ai", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["child-process"]
# Servers run as child processes, over stdin and stdout. This is how most MCP servers are
# distributed, and why this crate is separate from the runtime, which spawns no processes.
#
# note: `process` because `Server::spawn` takes and spawns a `tokio::process::Command`; `io-util`
# and `rt` to read the server's stderr in the background instead of inheriting it. `rmcp` gets the
# child's pipes rather than the command, so we can kill the child ourselves; see `Server::spawn`.
child-process = [
    "rmcp/transport-async-rw",
    "tokio/process",
    "tokio/io-util",
    "tokio/rt",
]
# Servers reached over HTTP.
http = ["rmcp/transport-streamable-http-client-reqwest"]

# tests that spawn a third-party server as a process, so they need `child-process`. `bridge.rs`
# runs a server in-process over a pipe and needs no feature.
[[test]]
name = "foreign"
path = "tests/foreign.rs"
required-features = ["child-process"]

[dependencies]
nachalnik.workspace = true
serde_json.workspace = true
# the official MCP SDK. `default-features = false` because its defaults build a server, and this
# crate is only a client. 3.9 because before it the HTTP client read a response body with no limit
# on its size (RUSTSEC-2026-0462)
rmcp = { version = "3.9", default-features = false, features = ["client"] }
# `time` and `macros` to wait for a call while watching for an interrupt; see `McpTool::invoke`.
# `rmcp` depends on `tokio` anyway, so this only adds features
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
nachalnik = { workspace = true, features = ["test"] }
# for the one live test, which gives a real model a real server's tools. Unversioned because
# `nachalnik-utils` is never published; cargo strips unversioned dev-dependencies when publishing
nachalnik-utils = { workspace = true }
# for property tests of the tool-name rewriting, which once had a collision bug; see `tool::tests`
proptest = { workspace = true }
# the tests run a real MCP server in-process over a pipe, so they test the actual protocol rather
# than a mock
rmcp = { version = "3.9", features = ["server", "transport-async-rw"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }
