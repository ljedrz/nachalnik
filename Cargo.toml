[workspace]
resolver = "3"
members = [
    "nachalnik",
    "nachalnik-mcp",
    "nachalnik-providers",
    "nachalnik-utils",
    "nachalnik-eval",
    "kamchatka",
]

# note: for the one artifact anybody downloads rather than builds - the `kamchatka` binary a
# release attaches. A library crate is compiled by whoever depends on it, under *their* profile,
# so none of this reaches a caller of `nachalnik`; what it changes is this workspace's own
# `--release` builds, which until there was a binary to publish nothing but a benchmark ran.
#
# note: `strip` rather than a `strip` step in the workflow, so that a binary built by hand is the
# binary a release attaches. A stripped one is not a worse one to report a bug from: this
# program's own trace is where a session is reconstructed from, not a backtrace off somebody's
# machine.
#
# note: `"fat"` rather than `"thin"`, which is the way round it is only because a release build
# happens once per tag and nobody is sitting in front of it. Measured 2026-09-15 on the static
# musl build of `kamchatka`: 23.3MB unstripped and 14.3MB stripped at the defaults, 12.0MB with
# thin and one codegen unit, 10.8MB with fat - against 22s, 22s, 44s and 72s to build. Fat is a
# tenth of the artifact for half a minute of a job that runs when a tag is pushed. Thin is the
# right answer for the trade made per-commit, and nothing here is built per-commit in release.
#
# note: `panic = "abort"` is the obvious next lever and is deliberately not pulled. A panicking
# tool is reported through a `JoinError` and the turn carries on; aborting would take the session
# with it, which is not a trade a program whose point is an honest account of what happened gets
# to make for a smaller download.
[profile.release]
codegen-units = 1
lto = "fat"
strip = true

# what every crate in here agrees on; a member opts in with `edition.workspace = true`
[workspace.package]
authors = ["ljedrz <ljedrz@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ljedrz/nachalnik"
homepage = "https://github.com/ljedrz/nachalnik"
rust-version = "1.88"

# note: declared here rather than in each crate, so that two members cannot quietly end up on
# two versions of the same thing. The runtime's five are the ones that matter: whatever else
# arrives in this workspace, `nachalnik` itself is not to grow a sixth without a reason.
[workspace.dependencies]
nachalnik = { version = "0.6.0", path = "nachalnik" }
nachalnik-mcp = { version = "0.6.0", path = "nachalnik-mcp" }
nachalnik-providers = { version = "0.4.0", path = "nachalnik-providers" }
# no version: it is never published, so nothing may depend on it except as a dev-dependency
nachalnik-utils = { path = "nachalnik-utils" }
async-trait = "0.1"
parking_lot = "0.12"
# `rc` so that `Content` can be cloned by bumping a refcount rather than copying a tool
# output; it changes no wire format, and adds no dependency
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# keepalive, which is the one socket option `tokio::net` does not offer - `TcpStream::set_nodelay`
# is tokio's own and `remote::tuned` uses it. Not a new crate in any sense that costs anything:
# `tokio` itself builds this for the `net` feature, and `reqwest` for its own reasons, so what the
# line buys is the right to call one method on a socket this workspace already owns
socket2 = "0.6"
tokio = { version = "1" }
# what the property suites are run by, and it gives them two things: a great many
# generated cases and, the half that matters, a shrinker: a property that fails comes back as the
# smallest input that still fails it rather than as whatever random string found it.
#
# note: dev-only, so nothing that depends on a crate in here ever builds it - cargo does not build
# the dev-dependencies of a dependency. It does stay in the published manifest, which is the part
# `nachalnik-utils` gets out of by being a path dependency with no version; a versioned
# dev-dependency is recorded there and simply never reached.
#
# note: `default-features = false` with `std` drops `fork` and `timeout`, which run each case in a
# subprocess so that a panicking or hanging case cannot take the harness with it. That is eleven
# crates - `rusty-fork`, `tempfile`, `rustix` and the rest - to guard against something that would
# fail the run anyway, and a property here is a pure function over a string.
proptest = { version = "1", default-features = false, features = ["std"] }
# `rustls-no-provider` rather than `default-tls`: in reqwest 0.13 that name resolves to rustls
# with `aws-lc-rs`, which is 1,659 C files and, on some platforms, cmake and NASM to build them.
# The provider is named below instead, which is what `no-provider` means.
#
# note: no `charset`, which makes `text()` a lossy UTF-8 read rather than a decode honouring the
# `Content-Type`. Nothing here notices: the three bodies it reads are two error payloads and one
# whole answer, all JSON, and JSON and SSE are both required to be UTF-8 - the streaming path
# takes chunks and never calls `text()`. The feature is additive, so a caller who wants the
# decode turns it on from their own manifest; leaving it off here spares the ones who do not
# `encoding_rs` and the SIMD crates behind it.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
# the cryptography under the TLS, chosen here because reqwest was told to bring none. `ring` is
# 17 C and assembly files, wants no cmake and no NASM, and is what rustls shipped with for years.
# No production Rust TLS stack is free of C altogether - the pure-Rust providers are unaudited,
# which is not a trade this workspace should make - so this is the smallest one rather than none.
#
# note: whoever builds a client also installs this, since `no-provider` leaves nothing to fall
# back on. It must stay on the same major as the rustls reqwest itself uses, or the provider goes
# into one rustls and the requests come out of another.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
