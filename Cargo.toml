[workspace]
resolver = "3"
members = [
    "nachalnik",
    "nachalnik-mcp",
    "nachalnik-providers",
    "nachalnik-utils",
    "nachalnik-eval",
    "kamchatka",
]

# note: this profile matters for the `kamchatka` binary attached to releases. Library crates are
# compiled under their dependents' profiles, so none of this affects users of `nachalnik`.
#
# note: `strip` is set here rather than in the release workflow, so a binary built by hand matches
# the released one. Stripping doesn't hurt bug reports: sessions are reconstructed from the
# program's own trace, not from backtraces.
#
# note: `"fat"` LTO rather than `"thin"`, because release builds only run once per tag. Measured
# 2026-09-15 on the static musl `kamchatka` build: 23.3MB unstripped and 14.3MB stripped with the
# defaults, 12.0MB with thin LTO and one codegen unit, 10.8MB with fat LTO; build times 22s, 22s,
# 44s and 72s. Fat LTO saves a tenth of the size for an extra half minute per release.
#
# note: `panic = "abort"` would shrink the binary further, but a panicking tool is reported as a
# failed call (`tool.panicked`) and the turn continues. Aborting would end the whole session.
#
# note: `opt-level = "s"` rather than the default `3` or `"z"`. Measured 2026-10-06 on the static
# musl `kamchatka` build: 13.6MB at `3` and 10.1MB at `"s"`, built in 102s and 60s; on glibc, `"z"`
# is another 0.8MB smaller than `"s"`. The cost is in drawing the screen, the only CPU-bound part:
# the tests that draw at every size run 15-18% slower at `"s"` and 75-80% slower at `"z"`, and
# nothing else changes, since the rest of a session's time goes to the network or child processes.
# A quarter off the download is worth a slightly slower frame; another 0.8MB is not worth nearly
# doubling it.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true

# note: no debuginfo in dev builds. Panics still name every frame, just without the file and line.
# Nothing here is debugged with a debugger: failing tests are read from their assertions, and
# sessions from the program's trace. Measured 2026-09-21 on a `--workspace --all-features --tests
# --examples` build: `target` is 2.6GB instead of 9.5GB with `debug = 2`, and touching a file in
# `nachalnik` rebuilds the workspace in 2.5s instead of 3.9s. `"line-tables-only"` would keep line
# numbers but costs 4.5GB.
#
# note: `incremental` stays on and `strip` stays off. Disabling incremental saves another 1GB but
# slows that rebuild to 6.9s. Stripping saves 0.3GB but removes the function names that panics
# are read by.
[profile.dev]
debug = 0

# note: dependencies are optimised in dev builds and the workspace's own crates are not, so
# rebuilding after an edit is as fast as before. The tests spend most of their time in dependency
# code (ratatui's layout solver and `unicode-width` dominate the slowest drawing test), which is
# several times slower unoptimised. Measured 2026-10-05 on four cores, like a CI runner: the whole
# suite under nextest takes 28.8s at `0`, 19.2s at `1` and 18.7s at `2`, with cold builds of 38s,
# 80s and 100s. `1` gets nearly all of the speedup for less build time, and a cold build only
# happens on a cache miss, while every test run benefits.
#
# note: only the optimisation level changes; debug assertions and overflow checks stay on.
[profile.dev.package."*"]
opt-level = 1

# shared by every crate; members opt in with `edition.workspace = true` and the like
[workspace.package]
authors = ["ljedrz <ljedrz@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ljedrz/nachalnik"
homepage = "https://github.com/ljedrz/nachalnik"
rust-version = "1.95"

# note: declared here rather than in each crate, so members can't drift onto different versions of
# the same dependency. `nachalnik` itself has five, and should not gain a sixth without a reason.
#
# note: every version here and in the members' manifests is a minimum: the lowest version the
# workspace builds with on its MSRV, not the one it is built with (that is whatever `Cargo.lock`
# has). A minimum set too low breaks builds for anyone whose lockfile has an older version - for
# example, `serde_json = "1"` allowed 1.0.0 for code that needs 1.0.127. CI's `minimal-versions`
# job checks this: every direct dependency at its minimum together, without dev-dependencies, on
# the MSRV with warnings denied. Warnings matter too: before 1.0.46, `anyhow!("{e}")` with a
# plain string compiles but prints `{e}` literally.
#
# note: some minimums are higher than our own code needs, because a dependency requires more:
# `async-trait` 0.1.89 because of `rmcp`, and `tokio` 1.47 and `serde` 1.0.220 likewise.
[workspace.dependencies]
nachalnik = { version = "0.9.1", path = "nachalnik" }
nachalnik-mcp = { version = "0.9.0", path = "nachalnik-mcp" }
nachalnik-providers = { version = "0.9.1", path = "nachalnik-providers" }
# no version: it is never published, so it may only be used as a dev-dependency
nachalnik-utils = { path = "nachalnik-utils" }
async-trait = "0.1.89"
parking_lot = "0.12"
# `rc` lets `Content` be cloned by bumping a reference count instead of copying tool output; it
# doesn't change any wire format or add a dependency
serde = { version = "1.0.220", features = ["derive", "rc"] }
serde_json = "1.0.127"
# for TCP keepalive, which `tokio::net` doesn't expose (`remote::tuned` uses tokio's own
# `set_nodelay`). It adds nothing to the build: `tokio` (for `net`) and `reqwest` already depend
# on it
socket2 = "0.6.3"
tokio = { version = "1.47" }
# runs the property tests: it generates many cases and, when one fails, shrinks it to the smallest
# failing input.
#
# note: a dev-dependency, so crates that depend on ours never build it. It does appear in the
# published manifest; `nachalnik-utils` avoids that by being an unversioned path dependency.
#
# note: `default-features = false` with `std` drops `fork` and `timeout`, which run each case in a
# subprocess so a panicking or hanging case can't kill the test harness. That costs eleven crates
# (`rusty-fork`, `tempfile`, `rustix` and others), and our properties are pure functions over
# strings, so a failure would fail the run anyway.
proptest = { version = "1", default-features = false, features = ["std"] }
# `rustls-no-provider` rather than `default-tls`: in reqwest 0.13 the default uses rustls with
# `aws-lc-rs`, which is 1,659 C files and on some platforms needs cmake and NASM. We pick the
# provider ourselves below.
#
# note: no `charset`, so `text()` is a lossy UTF-8 read instead of honouring the `Content-Type`.
# That's fine here: the only bodies read with it are two error payloads and one full answer, all
# JSON, and both JSON and SSE must be UTF-8 (streaming reads chunks and never calls `text()`).
# Callers who want charset decoding can enable the feature themselves; leaving it off spares
# everyone else `encoding_rs` and its SIMD dependencies.
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
# the crypto provider for rustls, since reqwest is told not to bring one. `ring` is 17 C and
# assembly files, needs no cmake or NASM, and was rustls's default for years. Every production
# Rust TLS stack has some C, and the pure-Rust providers are unaudited, so this is the smallest
# option rather than none.
#
# note: code that builds a client must install this provider, since `no-provider` gives no
# fallback. It must use the same rustls major version as reqwest, or the provider ends up in a
# different rustls than the one making requests.
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std", "tls12"] }
