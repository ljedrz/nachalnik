# note: only the GitHub Actions used by the workflows. Every `uses:` is pinned to a commit, so a
# moved tag can't change what runs with a release's token, but pins need updating to get fixes.
# One pull request a week with all updates, only for releases at least a week old, since a
# compromised release is usually caught and pulled within days.
#
# note: not `cargo`. Crate dependencies are updated with `cargo update` when we decide to, and
# Dependabot alerts cover advisories for the locked versions without any configuration here
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
