name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: formatting
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      # the tests turn both features on, so nothing else exercises the default build
      - name: default features
        run: cargo build --workspace
      # `nachalnik` has to stand up with neither of its features, `kamchatka` without MCP, and the
      # bridge with no transport at all - which is a real configuration: `Server::connect` takes
      # one you opened yourself
      - name: no features
        run: |
          cargo check -p nachalnik --no-default-features
          cargo check -p nachalnik-mcp --no-default-features
          cargo check -p kamchatka --no-default-features

      - name: tests
        # the live suite skips itself without a key, which is how it should behave in CI
        run: cargo test --workspace --all-features
      - name: docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: the examples that need no key
        run: |
          cargo run -p nachalnik --example transparency --features selectors
          cargo run -p nachalnik --example compaction

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets
