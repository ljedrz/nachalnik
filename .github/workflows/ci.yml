name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # the opinions: formatting, lints and documentation. One platform is enough for all three -
  # they say the same thing everywhere, and saying it three times only costs minutes
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: formatting
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      # both features are off by default and the documentation links into both, so this is the
      # configuration docs.rs will build rather than the one the tests happen to use
      - name: docs
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # note: three platforms because the crates claim to work on three. `nachalnik` and
  # `nachalnik-mcp` are pure Rust and ought to build anywhere; `kamchatka` says in its own readme
  # that away from Linux it still builds and runs with the shell unconfined, and until this ran
  # that sentence was a claim nothing checked. Its Landlock tests are `cfg(target_os = "linux")`
  # and simply find nothing to do elsewhere, which is the correct amount of nothing
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # the tests turn every feature on, so nothing else exercises the default build
      - name: default features
        run: cargo build --workspace --locked
      # `nachalnik` has to stand up with neither of its features, `kamchatka` without MCP, and the
      # bridge with no transport at all - which is a real configuration: `Server::connect` takes
      # one you opened yourself. One step each, so a failure says which
      - name: nachalnik, no features
        run: cargo check -p nachalnik --no-default-features --locked
      - name: nachalnik-mcp, no features
        run: cargo check -p nachalnik-mcp --no-default-features --locked
      - name: kamchatka, no features
        run: cargo check -p kamchatka --no-default-features --locked

      - name: tests
        # the live suites skip themselves without a key, which is how they should behave here
        run: cargo test --workspace --all-features --locked
      - name: the examples that need no key
        run: cargo run -p nachalnik --example transparency --features selectors --locked
      - name: the compacting example
        run: cargo run -p nachalnik --example compaction --locked

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets --locked

  # note: what a crate is on the registry is not what the working tree is - a path dependency that
  # has to become a version, a symlinked licence, a file `git` never tracked. This
  # packages all four and builds each from its own tarball, with the members that are being
  # published unpacked into a temporary registry so the ones above them are built against what
  # would really be uploaded rather than against the directory next door.
  #
  # note: `package` rather than `publish --dry-run`, so that this job goes on passing after the
  # versions it is checking exist on the registry
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --locked
