name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# note: read-only. No job writes anything back (comments, statuses, caches beyond Actions' own),
# so the token every step can access can't write either
permissions:
  contents: read

# a new push to the same branch or pull request cancels the previous run, which would only test a
# commit that won't be merged
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # formatting, lints and documentation. One platform is enough, since the results are the same on
  # all of them
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: formatting
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      # and again without the screen, because some lints only fire there, and the test job's
      # `check` and `test` runs only warn. `recalled` reached a release that way: a field only used
      # behind `tui`, so it was dead code without the screen, which `--all-features` can't see.
      # These are `kamchatka`'s two builds without a screen: the plain one, and the one the README
      # suggests for embedding
      - name: clippy, no screen
        run: cargo clippy -p kamchatka --no-default-features --all-targets --locked -- -D warnings
      - name: clippy, no screen with mcp
        run: >
          cargo clippy -p kamchatka --no-default-features --features mcp --all-targets --locked
          -- -D warnings
      # with all features, as docs.rs builds it, since the docs link to features that are off by
      # default
      - name: docs
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # and references rustdoc doesn't check: files and tests named in comments or documents that
      # no longer exist
      - name: references
        run: scripts/references.sh

  # checks advisories, licences and crate sources against `deny.toml`. A separate job, because a
  # new advisory can make it fail on a commit that changed nothing, and that shouldn't fail the
  # lint job too
  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # note: the libraries (runtime, providers, MCP bridge, benchmark) are pure Rust and should build
  # anywhere, so they're tested on Linux, macOS and Windows. `kamchatka` only builds for Linux on
  # x86_64 and aarch64 (its `lib.rs` refuses other targets), so it's excluded from macOS and
  # Windows and tested on both Linux architectures. The aarch64 job is the only one that compiles
  # the network gate's aarch64 filter, and the aarch64 release binary is built on the same runner.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kamchatka: true
          - os: ubuntu-24.04-arm
            kamchatka: true
          - os: macos-latest
            kamchatka: false
            skip: --exclude kamchatka
          - os: windows-latest
            kamchatka: false
            skip: --exclude kamchatka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # note: nextest rather than `cargo test`, which runs one test binary at a time. Nextest runs
      # them all in parallel: on four cores the suite takes 35 seconds instead of 116. The `ci`
      # profile is in `.config/nextest.toml`
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: nextest

      # the tests enable every feature, so this is the only check of the default build
      - name: default features
        run: cargo build --workspace ${{ matrix.skip }} --locked
      # `nachalnik` without its features, `kamchatka` without MCP, and the MCP bridge with no
      # transport (a real configuration: `Server::connect` takes one you opened yourself). One
      # step each, so a failure shows which
      - name: nachalnik, no features
        run: cargo check -p nachalnik --no-default-features --locked
      - name: nachalnik-mcp, no features
        run: cargo check -p nachalnik-mcp --no-default-features --locked
      # `test` rather than `check`, because most of the program works without `tui`: the permission
      # policy, real commands in the sandbox, the introspection tools, whole headless sessions and
      # the settings file. This is the only place they're tested without a screen
      - name: kamchatka, no features
        if: matrix.kamchatka
        run: cargo nextest run -p kamchatka --no-default-features --locked --profile ci
      # and the build the README suggests for embedding: MCP tools, no screen. Nothing else
      # compiles this combination, which once let a bug through: a settings file with every key was
      # rejected in this build because of an empty `mcp` key
      - name: kamchatka, mcp and no screen
        if: matrix.kamchatka
        run: >
          cargo nextest run -p kamchatka --no-default-features --features mcp --locked
          --profile ci
      # each API alone, the System One client alone, and no features at all. `waiting.rs` is
      # shared, so a constant only one API uses is dead code in the others' builds.
      # `--all-targets` because tests are gated by API too, and a test that names a missing
      # provider would otherwise only fail to compile when it isn't covered by `--all-features`
      - name: nachalnik-providers, gemini only
        run: cargo check -p nachalnik-providers --all-targets --no-default-features --features gemini --locked
      - name: nachalnik-providers, anthropic and the suite
        run: cargo check -p nachalnik-providers --all-targets --no-default-features --features anthropic,conformance --locked
      - name: nachalnik-providers, openai and the suite
        run: cargo check -p nachalnik-providers --all-targets --no-default-features --features openai,conformance --locked
      - name: nachalnik-providers, system1 only
        run: cargo check -p nachalnik-providers --all-targets --no-default-features --features system1 --locked
      - name: nachalnik-providers, no features
        run: cargo check -p nachalnik-providers --all-targets --no-default-features --locked

      - name: tests
        # the live tests skip themselves without an API key, as they should here
        run: cargo nextest run --workspace ${{ matrix.skip }} --all-features --locked --profile ci
      # doc examples, which nextest doesn't run
      - name: doctests
        run: cargo test --workspace ${{ matrix.skip }} --all-features --locked --doc
      - name: the examples that need no key
        run: cargo run -p nachalnik --example transparency --features selectors --locked
      - name: the compacting example
        run: cargo run -p nachalnik --example compaction --locked
      - name: the pricing example
        run: cargo run -p nachalnik --example pricing_a_picture --locked

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-features --all-targets --locked

  # every direct dependency at its minimum version, together, on the MSRV: what someone with an
  # old lockfile gets. Dev-dependencies are excluded, since our dependents never build them; see
  # the note above `[workspace.dependencies]`.
  #
  # note: no cache, since this uses a different lockfile from the repository's
  minimal-versions:
    name: minimal versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-hack,cargo-minimal-versions
      - run: cargo minimal-versions check --workspace --all-features --direct

  # note: a published crate can differ from the working tree (path dependencies turned into
  # versions, symlinked licences, untracked files). This packages all five crates and builds each
  # from its tarball, against the packaged versions of the others rather than the local
  # directories.
  #
  # note: `package` rather than `publish --dry-run`, which would fail once the versions being
  # checked are already published
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo package --workspace --locked
