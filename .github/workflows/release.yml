name: release

# note: only `kamchatka-v*` tags. Every crate is tagged on release, but only `kamchatka` is a
# program; the libraries are published as crates.io tarballs, which CI's `package` job checks. The
# workspace `v*` tag has the runtime's version and would build the same binary again under a
# misleading name.
#
# note: `workflow_dispatch` lets this run without a tag. Otherwise it only runs on release days,
# and the musl toolchain, a C dependency and third-party actions can all break in between. A manual
# run builds and packages but uploads nothing; see `dry-run` below.
on:
  push:
    tags:
      - kamchatka-v[0-9]+.*
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # creates the release, with this version's changelog section as its body. `prefix` allows tags
  # like `kamchatka-v0.11.0` and makes `$version` in the title just the number
  #
  # note: only on a push. A manual run can target a tag, and checking only the ref would then
  # publish a release while `dry-run` withheld the binaries
  #
  # note: the toolchain version is chosen here once, both binaries are built with it, and the
  # release notes name it. Reproducing a binary needs the same toolchain, and "whatever was stable
  # that day" can't be installed a month later
  create-release:
    name: create the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rust: ${{ steps.rustc.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - id: rustc
        name: the toolchain
        run: |
          rustc -V
          echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "full=$(rustc -V)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          prefix: kamchatka
          title: $prefix $version
          changelog: kamchatka/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: the toolchain, in the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUSTC: ${{ steps.rustc.outputs.full }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            > "$RUNNER_TEMP/notes.md"
          printf '\nBuilt with `%s`.\n' "$RUSTC" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"

  # note: `!failure() && !cancelled()` because `create-release` is skipped on a manual run, which
  # would otherwise skip this job too, and this job must run either way
  #
  # note: two targets, both static musl Linux, each built on a runner of its own architecture, so
  # nothing cross-compiles and `build-tool: cargo` below works for both. `kamchatka` only builds
  # for Linux on x86_64 and aarch64; 0.15.1 was the last version with a Mac binary.
  binary:
    name: the ${{ matrix.what }} binary
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # needed for attestations: a token identifying this workflow run, and permission to record
      # what it built
      id-token: write
      attestations: write
    strategy:
      # so a failing target doesn't cancel the other one; on a tag the release already exists by
      # the time these run
      fail-fast: false
      matrix:
        include:
          - what: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - what: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the version `create-release` chose; a manual run uses stable
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ needs.create-release.outputs.rust || 'stable' }}
      # note: no cache. Releases are built once per tag, and any workflow run in the repository can
      # write to the cache, which shouldn't be able to affect the shipped build

      # note: embeds the dependency tree in the binary (a few kilobytes), so `cargo audit bin` and
      # other scanners can tell which crates a downloaded `kamchatka` contains. The action below
      # always runs plain `cargo build`, so a `cargo` wrapper earlier on `PATH` turns `build` into
      # `auditable build` and passes everything else through
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-auditable
      - name: every build through cargo-auditable
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          real=$(command -v cargo)
          printf '#!/bin/sh\nif [ "$1" = build ]; then shift; exec "%s" auditable build "$@"; fi\nexec "%s" "$@"\n' \
            "$real" "$real" > "$RUNNER_TEMP/shim/cargo"
          chmod +x "$RUNNER_TEMP/shim/cargo"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"

      # note: Rust ships its own musl libc, but `ring` compiles C, and `musl-tools` provides the
      # compiler for it. `CC_` names the compiler explicitly rather than relying on `cc`'s guess
      - name: the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # note: dependency sources live under `CARGO_HOME`, and panic messages embed their paths, so
      # without this only someone with the runner's home directory could reproduce the binary.
      # Remapped, anyone with the same toolchain and `Cargo.lock` can; `reproduce` below checks it
      - name: the paths a build leaves in the binary
        run: echo "RUSTFLAGS=--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"

      # note: static musl rather than glibc, so the binary runs on any Linux with a new enough
      # kernel, regardless of distribution. The sandbox works with it: `kamchatka`'s tests,
      # including the Landlock ones, pass on the x86_64 musl target. aarch64 is the same code, and
      # CI's `ubuntu-24.04-arm` job runs the tests on that architecture with glibc.
      #
      # note: `build-tool: cargo`, because otherwise the action uses `cross` whenever the target
      # differs from the host, which means installing it from source and building in a container.
      # The only thing to cross-compile is one C dependency, handled above, and building with the
      # same toolchain the tests ran with is better.
      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        with:
          bin: kamchatka
          package: kamchatka
          target: ${{ matrix.target }}
          build-tool: cargo
          locked: true
          checksum: sha256
          # in addition to the defaults, because users of a downloaded binary can't add features
          # later, and without it the `--advise` flag documented in the README wouldn't exist.
          #
          # note: this only makes the feature available; nothing is sent anywhere unless `--advise`
          # is given. The feature exists to keep the dependency out of builds that don't want it.
          #
          # note: in this binary, `--advise` therefore enables everything `shell-advisor` sends:
          # a rating for every command the model writes, not only for calls the rules would allow.
          # The flag's `--help` says so; see `tools::advice`.
          features: shell-advisor
          # the settings file with every setting at its default, to copy and edit:
          # `kamchatka --config-file kamchatka.json`. `cargo install` doesn't copy files, so the
          # archive is how people who didn't clone the repository get it.
          #
          # note: the licence and docs are no longer included, because copies go out of date; the
          # README, guide, running notes and changelog are a link away.
          #
          # note: it goes in the archive's root, without the `kamchatka/` directory
          include: kamchatka/kamchatka.json
          leading-dir: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # note: builds the binary again from a checkout at a different path, with crates in a
      # different `CARGO_HOME` (the two things that differ for someone reproducing a release),
      # and compares it byte for byte with the one above. It runs after the upload because the
      # upload step is also the build; on a tag, a failure means a published release can't be
      # reproduced
      - name: reproduce
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          shipped="$PWD/target/${{ matrix.target }}/release/kamchatka"
          again="$RUNNER_TEMP/again"
          git worktree add --detach "$again" HEAD
          cd "$again"
          CARGO_HOME="$RUNNER_TEMP/cargo-again" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/target-again" \
            RUSTFLAGS="--remap-path-prefix=$RUNNER_TEMP/cargo-again=/cargo" \
            cargo auditable build --release --locked -p kamchatka --bin kamchatka \
              --features shell-advisor --target ${{ matrix.target }}
          rebuilt="$RUNNER_TEMP/target-again/${{ matrix.target }}/release/kamchatka"
          sha256sum "$shipped" "$rebuilt"
          cmp "$shipped" "$rebuilt"

      # note: proves the archive was built by this repository, workflow and tag, which a checksum
      # can't, since whoever could replace the archive could replace the checksum too. Verify with
      # `gh attestation verify ARCHIVE --repo ljedrz/nachalnik`. Only on tags, since manual runs
      # don't publish anything
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            ${{ steps.upload.outputs.tar }}
            target/${{ matrix.target }}/release/kamchatka
