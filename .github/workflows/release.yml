name: release

# note: `kamchatka-v*` and nothing else. Every crate in here is tagged on release and only one of
# them is a program - the rest are libraries, whose artifact is the crates.io tarball the
# `package` job already checks. The workspace `v*` tag carries the runtime's number and would
# build the same binary a second time under a name that does not say what it is.
#
# note: `workflow_dispatch` so that this can be run without tagging anything. A release workflow
# is exercised once a cycle, on the one day it must not fail, and a musl toolchain, a C dependency
# and somebody else's action are three things that can go stale between tags. Dispatched, it
# builds and packages and uploads nothing - see `dry-run` below.
on:
  push:
    tags:
      - kamchatka-v[0-9]+.*
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # the release itself, with the changelog section for this version as its body. `prefix` is what
  # lets the tag be `kamchatka-v0.11.0` rather than `v0.11.0`, and what makes `$version` in the
  # title the number alone
  #
  # note: on a push and nothing else. A dispatch can be run against a tag - the form offers them -
  # and on the ref alone that would publish a release while `dry-run` held back its binaries
  create-release:
    name: create the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          prefix: kamchatka
          title: $prefix $version
          changelog: kamchatka/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # note: `!failure() && !cancelled()` rather than nothing, because `create-release` is skipped on
  # a dispatch and a job that needs a skipped job is skipped too. This has to run in both cases:
  # on a tag it is the artifact, and on a dispatch it is the whole point
  #
  # note: two targets, both static musl Linux, and each is built on a runner of its own
  # architecture - so nothing here cross-compiles and `build-tool: cargo` below is right for both.
  # `kamchatka` builds for Linux on x86_64 and aarch64 and nothing else; 0.15.1 was the last
  # version with a Mac binary.
  binary:
    name: the ${{ matrix.what }} binary
    needs: create-release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # a target that will not build is worth knowing about on its own rather than through the
      # other one being cancelled, and on a tag the release is already made by the time these run
      fail-fast: false
      matrix:
        include:
          - what: x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - what: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # note: the one thing in the tree that needs a cross toolchain at all. Rust ships its own
      # musl libc and links against that; what has no Rust in it is `ring`, which compiles C, and
      # `musl-tools` is the compiler for it. `CC_` names the target explicitly rather than
      # trusting `cc`'s own guess at which compiler a musl target wants
      - name: the musl C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      # note: static musl rather than glibc, so that what a release attaches runs wherever the
      # kernel is new enough rather than wherever the distribution is. The confinement survives
      # it: `kamchatka`'s suite has passed against the x86_64 target, Landlock tests included,
      # which is the one thing worth having checked before shipping a single file that claims to
      # sandbox what it runs. The aarch64 one is the same code, and CI's `ubuntu-24.04-arm` column
      # runs the suite on that architecture under glibc.
      #
      # note: `build-tool: cargo` because the action would otherwise choose `cross` - the target
      # is not the host, and that is its rule - which means installing `cross` from source and
      # building in a container. There is nothing to cross here but one C dependency, the line
      # above is the compiler for it, and a binary built by the toolchain the tests ran under is
      # worth more than one built somewhere else.
      - uses: taiki-e/upload-rust-binary-action@v1
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        with:
          bin: kamchatka
          package: kamchatka
          target: ${{ matrix.target }}
          build-tool: cargo
          locked: true
          checksum: sha256
          # on top of the defaults, and it is the one feature that has to be *built* in to be
          # available at all: somebody who downloaded a binary cannot add it later. A build
          # without it is a `--advise` that does not exist, which is a flag the readme documents
          # and the download does not have.
          #
          # note: what this ships is the *ability*, and nothing is sent anywhere without
          # `--advise` on the command line. That flag is the disclosure and always was; the
          # feature gate is what keeps a third-party dependency out of builds that do not want
          # one, and a released binary is by definition not one of those.
          #
          # note: it does collapse the two opt-ins into one for anybody using this binary.
          # `shell-advisor` is a second feature because it widens what leaves the machine - the
          # verdict goes only for calls the rules would allow, the rating for every command the
          # model writes - and in a build carrying both, `--advise` turns on both. What still
          # says so is the flag's own `--help`, which names the wider disclosure in as many
          # words. See `tools::advice`.
          features: shell-advisor
          # the one file that is worth more beside the binary than it is on a web page. Every
          # setting the program has, named and at its default, for somebody who wants to stop
          # typing the same four arguments: `kamchatka --config-file kamchatka.json` and edit it.
          # A `cargo install` copies no files, so an archive is the only way it reaches anybody
          # who did not clone the repository.
          #
          # note: the licence and the four documents used to be in here and are not, because a
          # copy of a document is a document that goes out of date in somebody's downloads folder
          # while the one it was copied from is corrected. The readme, the guide, the running
          # notes and the changelog are a link away and always current; the licence is in the
          # repository and is not something a reader of it downloads a binary to find.
          #
          # note: it lands at the root of the archive under its basename, so the `kamchatka/` in
          # front of it is where it is read from and not where it ends up
          include: kamchatka/kamchatka.json
          leading-dir: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          token: ${{ secrets.GITHUB_TOKEN }}
