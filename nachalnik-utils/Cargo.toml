[package]
name = "nachalnik-utils"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Never published. It exists so that this crate's own examples and its live test suite stop
# carrying two copies of the same provider; it is not API, it makes no promises, and the version
# stays 0.0.0 so that nothing can come to depend on it by accident.
publish = false

[dependencies]
nachalnik.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
nachalnik = { workspace = true, features = ["test"] }
reqwest.workspace = true
rustls.workspace = true
# `net` and `io-util` for the one test that needs a real socket: a server that breaks a stream at
# a chosen byte, which is the only way to reach the assembly inside `respond`
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
