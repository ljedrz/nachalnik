[package]
name = "nachalnik-eval"
version = "0.8.0"
description = "A benchmark for model introspection: elicit a claim about its own state, intervene, and measure whether the claim was true."
documentation = "https://docs.rs/nachalnik-eval"
readme = "README.md"
categories = ["development-tools::testing", "asynchronous"]
# note: the literature calls this `metacognition`, but people search for `introspection`. `eval`
# is for people looking for an evaluation harness rather than a runtime.
keywords = ["llm", "ai", "eval", "introspection", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
nachalnik.workspace = true

async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# `time` only, to enforce rate limits; see `abreast::Rate`. `nachalnik` already depends on tokio,
# so this adds no crate, only the timer, which is needed when an endpoint limits requests per
# second rather than requests in flight.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# the scripted provider and ready-made policies, for tests that must not use the network. The
# feature is on for this crate's tests only, as in `nachalnik`
nachalnik = { workspace = true, features = ["test"] }
# the provider the live tests and the `bench` example use, and the helper that reads its settings.
# Unversioned so cargo strips them when publishing; see `nachalnik/Cargo.toml` for why
nachalnik-providers = { path = "../nachalnik-providers" }
nachalnik-utils = { path = "../nachalnik-utils" }
# `test-util` for a paused clock in the rate-limit tests, so they wait exactly and instantly
# instead of sleeping
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
