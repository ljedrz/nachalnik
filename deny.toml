# Rules for the dependency tree, checked by `cargo deny check` in CI's `deny` job.
#
# note: all features and targets, because the released `kamchatka` is built with `shell-advisor`
# and the libraries are built on three platforms. A crate used by only one configuration still
# ships.
[graph]
all-features = true

# note: the defaults, which fail on known vulnerabilities, unmaintained crates and yanked versions.
# Nothing is ignored; an exception would need the advisory's id and a reason it doesn't affect us.
[advisories]
version = 2

# note: only the licences the tree actually uses, so adding a new one is a deliberate decision.
# Dual-licensed crates are covered by MIT or Apache-2.0; the rest are for crates without that
# option: MPL-2.0 for `nucleo-matcher` and `char_index` (file-level copyleft, which puts no
# requirements on our code), CDLA-Permissive-2.0 for the root certificates in
# `webpki-root-certs`, ISC, BSD-3-Clause, Zlib and BSL-1.0 for `ring`, `untrusted`,
# `rustls-webpki`, `subtle`, `foldhash` and `ryu`, and the Unicode licence for Unicode tables.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# `nachalnik-utils` is never published
private = { ignore = true }

# note: duplicate versions of a crate only warn. There are several, all from our dependencies,
# so fixing them is up to their maintainers. Wildcard versions are refused except for path
# dependencies, since `nachalnik-utils` is deliberately unversioned (see the workspace manifest).
[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# crates.io only: no git dependencies or other registries
[sources]
unknown-registry = "deny"
unknown-git = "deny"
