<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kamchatka</title>

<!--
  The whole client. No build step, no framework, no bundler, no dependency - it is served by
  examples/gateway.rs out of an include_str!, and everything it knows about the session it learns
  from the protocol.

  What it does that is worth reading:

  * the conversation comes from a projection, and can come from nowhere else. The records name
    things rather than carrying them, so a page fed only the stream can follow a turn as it arrives
    and cannot render a word of what happened before it connected. The stream keeps the chat
    current between projections by appending; anything that changes its *shape* rather than its end
    - an item excluded, a compaction, an undo - asks for a new one and draws that.
  * anything it finds it has no text for - an item added by somebody else, an answer it missed
    while it was away - it asks for with `inspect`. That is the other half of the same decision.
  * it never reconnects. `EventSource` does that by itself, and sends `Last-Event-ID`, which the
    gateway turns into `attach { since }`. Resume, for free.
  * a permission question takes the prompt's place rather than stacking above it, which is what the
    terminal does and for the same reason: the box the keys are in should be the box on the screen.
  * the four views are the terminal's tabs, in the terminal's order, drawn from what the terminal
    draws them from. Everything but the chat comes from a projection and asks for a fresh one on
    the way in, because none of it can be worked out from the stream: `going`, `left_out` and
    `marker` are answers about the *next request*, and the trace is the events in this program's
    own words with the gaps the pane puts beside them. Writing either here would be a second
    vocabulary for one session, and it would be the one nobody at the other end can see.
  * the prompt is on the chat and nowhere else, which is where the terminal keeps it. A waiting
    question colours the cycler instead of following you about, the way the tab strip goes red
    upstairs.
-->

<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1c1b19; --dim: #6b6862; --line: #bdb6a9;
    --user: #2d4f6b; --note: #6b6862; --call: #6b4f2d; --bad: #8c2f22;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --fg: #e8e4dc; --dim: #8a867e; --line: #4a443b;
      --user: #8fb8d8; --note: #8a867e; --call: #d0a878; --bad: #e08074;
    }
  }
  /* note: `--line` is every border on the page - the header, the footer, a row's rule, the box you
     type in - and it was two shades off the background, which is a hairline on a good monitor and
     nothing at all on a phone in daylight. About 2:1 against the background in either scheme now,
     which is a line somebody can find without it reading as a heavy rule */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height: 100dvh; display: flex; flex-direction: column;
  }
  header {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline;
    font-size: 12px; color: var(--dim);
  }
  header b { color: var(--fg); font-weight: 600; }
  /* the cycler sits in the corner the tab strip is in upstairs, and takes the space left over */
  #view {
    margin-left: auto; font-size: 12px; padding: 4px 10px; min-height: 0;
    color: var(--dim); white-space: nowrap;
  }
  #log, #panel { flex: 1; overflow-y: auto; padding: 12px; overscroll-behavior: contain; }
  #panel { display: none; }
  body:not(.chat) #log { display: none; }
  body:not(.chat) #panel { display: block; }
  /* note: no prompt anywhere but the chat, which is where the terminal keeps it too. A box that
     takes a line is a box on the chat, and a view that is a list of rows has nothing to say to one.
     What a waiting question does instead is colour the cycler, the way the tab strip goes red
     upstairs: from another view the question is not the thing you are looking at */
  body:not(.chat) footer { display: none; }
  #view.asked { border-color: var(--bad); color: var(--bad); }
  /* a row is the same shape on both of them: a name, some figures, and why */
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row.act { cursor: pointer; }
  /* the name takes the room and the button keeps its own, so a long path wraps rather than
     squeezing the one control on the row down to nothing */
  .head { display: flex; gap: 8px; align-items: flex-start; }
  .name { overflow-wrap: anywhere; flex: 1; min-width: 0; }
  .state {
    font: inherit; font-size: 12px; padding: 2px 8px; min-height: 0; border-radius: 4px;
    white-space: nowrap; flex: none;
  }
  .state.active { border-color: var(--user); color: var(--user); }
  .state.elided { border-color: var(--call); color: var(--call); }
  .state.excluded { border-color: var(--bad); color: var(--bad); }
  .figures { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .why { font-size: 12px; color: var(--note); margin-top: 2px; font-style: italic; }
  .body {
    display: none; margin-top: 8px; padding: 8px; white-space: pre-wrap;
    overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 6px;
  }
  .row.open .body { display: block; }
  .empty { color: var(--dim); }
  .seq { color: var(--dim); }
  .detail { font-size: 12px; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
  /* the figure being looked for, so it keeps the right-hand edge and a colour of its own */
  .gap { font-size: 12px; color: var(--call); white-space: nowrap; flex: none; }
  .allowed { color: var(--user); } .denied { color: var(--bad); } .asks { color: var(--call); }
  .line { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line::before { color: var(--dim); }
  .user { color: var(--user); } .user::before { content: "> "; }
  .model::before { content: ""; }
  .reasoning { color: var(--dim); font-style: italic; } .reasoning::before { content: "~ "; }
  .call { color: var(--call); } .call::before { content: "\2329 "; }
  .result { color: var(--dim); } .result::before { content: "< "; }
  .note { color: var(--note); } .note::before { content: "\00b7 "; }
  .error { color: var(--bad); } .error::before { content: "! "; }
  .pending { opacity: .45; }
  footer { border-top: 1px solid var(--line); padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  form { display: flex; gap: 8px; }
  /* 16px or iOS zooms the whole page when the box is focused */
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 16px; padding: 8px;
    background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: 6px; min-height: 42px; max-height: 30vh;
  }
  button {
    font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: inherit; min-height: 42px;
  }
  button:disabled { opacity: .4; }
  #question { display: none; }
  #question.open { display: block; }
  #question p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  #answers { display: flex; gap: 8px; flex-wrap: wrap; }
  #answers button { flex: 1; }
  .allow { border-color: var(--user); } .deny { border-color: var(--bad); }
  #busy { color: var(--dim); }
  /* note: the corner a person's eye is already in, because the session name is there and it is the
     first thing read. A turn can be a minute of nothing arriving - a model thinking, a command
     running, a provider gone quiet - and a page with no pulse in it is indistinguishable from a
     page whose connection died */
  #pulse { color: var(--call); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  /* a reader who asked for no animation gets a steady dot, which says the same thing */
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; } }
</style>

<header>
  <span id="pulse" hidden>&#9679;</span>
  <b id="model">connecting…</b>
  <span id="budget"></span>
  <span id="busy"></span>
  <button id="view" type="button" title="the next view: chat, context, events, permissions">chat</button>
</header>

<div id="log"></div>
<div id="panel"></div>

<footer>
  <form id="prompt">
    <textarea id="line" rows="1" placeholder="ask for something, or /help" autocomplete="off"></textarea>
    <button type="submit">send</button>
  </form>
  <div id="question">
    <p id="asked"></p>
    <div id="answers">
      <button class="allow" data-grant="allow">allow</button>
      <button class="allow" data-grant="always">always</button>
      <button class="deny" data-grant="deny">deny</button>
    </div>
  </div>
</footer>

<script>
// note: not `crypto.randomUUID()`, which is only defined in a secure context - so it is `undefined`
// on plain http from a phone, which is the one place this page is meant to be opened.
const tab = Math.random().toString(36).slice(2) + Date.now().toString(36);

const log = document.getElementById("log");
const prompt = document.getElementById("prompt");
const line = document.getElementById("line");
const question = document.getElementById("question");
const asked = document.getElementById("asked");

let asking = [];        // the questions waiting on somebody, oldest first
let open = null;        // the bubble a model is still writing into
let streaming = false;  // whether the fragments arriving still belong to anything
let wanted = new Set(); // items already asked about, so nothing is asked about twice
let pending = [];       // lines this page drew on sending, not yet tied to an item
let mine = new Set();   // the items those lines turned out to be
let latest = null;      // the last projection, which is what every view but the chat is drawn from
let stale = false;      // whether the chat no longer matches the context, and a rebuild is owed
let showing = "chat";   // which of the four is on screen

/**
 * The views, in the order the terminal's tab strip has them.
 *
 * note: the order is `Tab::ALL`, deliberately, down to the event log sitting where the trace does
 * rather than at the end where it was easiest to add. Somebody who knows one of these two should
 * not have to learn the other's habits, and tab order is the cheapest kind of similarity there is.
 */
const VIEWS = ["chat", "context", "events", "permissions"];
/**
 * The records after which the chat is not what the context says any more.
 *
 * note: named rather than "anything context-shaped", because `context.added` is the one this page
 * already draws for itself as it arrives, and rebuilding on it would take the bubble a model is
 * writing into away every time a turn was recorded.
 */
const RESHAPES = new Set([
  "context.changed",
  "context.replaced",
  "context.undone",
  "context.redone",
  "context.compacted",
]);

/**
 * Says the chat no longer matches the context, and asks for what does.
 *
 * note: an item that changed state changed the conversation, and not in a way this page can work
 * out. An excluded item is gone from the chat; an elided one is still there in full, because
 * eliding is about what the *model* is sent and the marker is for it rather than for the person.
 * Which of those a given state means is `ContextState::is_projected`, over in the runtime, and a
 * page that reimplemented it would be a second copy of a rule that has six cases and gains them.
 *
 * note: a flag rather than a redraw, because the answer arrives later and may arrive at a bad
 * moment - see the `projected` case. Asking twice is cheap and rebuilding under a model that is
 * still typing is not.
 */
function restale() {
  stale = true;
  send({ do: "project" });
}

/**
 * Draws the conversation out of a projection, which is the only thing that knows its shape.
 *
 * note: this is what `attached` does and what a rebuild after a state change does, and they are
 * one function because they are one act. What it is *not* is a second account of the chat beside
 * the stream: the projection says what the conversation is, and the stream keeps it current
 * between projections by appending what has just happened. The moment the stream cannot - which
 * is any change to the *shape* rather than the end of it - this is what answers.
 */
function conversation(lines) {
  // note: the same question `say` asks, and for the same reason: somebody who has scrolled up to
  // read something is reading it, and a rebuild that yanked them back to the newest line would
  // make every recorded turn take the page away from them
  const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const was = log.scrollTop;
  log.replaceChildren();
  wanted.clear();
  pending = [];
  mine.clear();
  open = null;
  for (const l of lines) say(l.speaker, l.text, l.item ?? undefined);
  log.scrollTop = stuck ? log.scrollHeight : was;
}

/** Sends one command. The answer comes back on the stream, not from here. */
async function send(command) {
  await fetch(`/do?tab=${tab}`, { method: "POST", body: JSON.stringify(command) });
}

/** Adds a line, keeping the view at the bottom if it was already there. */
function say(kind, text, item) {
  const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const el = document.createElement("p");
  el.className = "line " + kind;
  el.textContent = text;
  if (item !== undefined) el.dataset.item = item;
  log.append(el);
  if (stuck) log.scrollTop = log.scrollHeight;
  return el;
}

/**
 * Ties the oldest line this page drew on sending to the item it turned out to be.
 *
 * note: what stops a message appearing twice. A line is drawn the moment it is sent, because a
 * message handed into a running turn is *queued* and does not become an item until that turn ends -
 * which can be minutes, and a page that waited would have swallowed it. But it does become one
 * eventually, and `context.added` is how everybody hears about it, so without this the page
 * inspected its own message and drew it a second time underneath the first.
 *
 * note: claimed from either direction, because the order is not guaranteed. `replied` carries the
 * item a line was asked as and arrives on the command path; `context.added` arrives on the record
 * path; whichever gets here first binds, and the second finds it already bound.
 */
function claim(id) {
  if (mine.has(id)) return true;
  const el = pending.shift();
  if (!el) return false;
  mine.add(id);
  el.dataset.item = id;
  return true;
}

/** Asks what an item actually says, once, and leaves somewhere to put it. */
function inspect(id, kind) {
  if (wanted.has(id)) return;
  wanted.add(id);
  // a place for it, unless something on screen is already showing this item
  if (!log.querySelector(`[data-item="${id}"]`)) {
    say(kind, "…", id).classList.add("pending");
  }
  send({ do: "inspect", id });
}

/**
 * Moves to a view and draws it.
 *
 * note: it asks for a projection every time rather than drawing the one it has, and the staleness
 * it is avoiding is not the obvious one. The items can be read out of the records - `context.added`
 * names each as it arrives - but what the context view is *for* is the columns that say what the
 * next request will do with each of them, and those are worked out by projecting rather than
 * recorded by anything. A page that accumulated rows from the stream would show a column that was
 * right when the item arrived and has been wrong since.
 *
 * note: what it does not ask for is the conversation, even though the answer carries one. The chat
 * is drawn from the stream as it arrives and is already right; taking it from here as well would
 * be two accounts of one thing, and the projection's is the one that cannot show a model still
 * typing.
 */
function show(next) {
  showing = next;
  document.body.className = next;
  document.getElementById("view").textContent = next;
  draw();
  // every view but the chat is drawn from a projection, so every one of them asks for a fresh one
  // on the way in. The chat is the exception because the stream keeps it current; see `restale`
  if (next !== "chat") send({ do: "project" });
}

document.getElementById("view").onclick = () => {
  show(VIEWS[(VIEWS.indexOf(showing) + 1) % VIEWS.length]);
};

/** One row: a name, a line of figures under it, and a reason where there is one. */
function row(into, name, figures, why) {
  const el = document.createElement("div");
  el.className = "row";
  // the name and whatever control the row carries share a line, so the control keeps its place
  // when a path wraps to three of them
  const head = document.createElement("div");
  head.className = "head";
  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name;
  head.append(label);
  el.append(head);
  if (figures) {
    const sub = document.createElement("div");
    sub.className = "figures";
    sub.textContent = figures;
    el.append(sub);
  }
  if (why) {
    const sub = document.createElement("div");
    sub.className = "why";
    sub.textContent = why;
    el.append(sub);
  }
  into.append(el);
  return el;
}

/** Whichever panel is open, from the last projection; the chat is not one of them. */
function draw() {
  if (showing === "chat") return;
  const panel = document.getElementById("panel");
  panel.replaceChildren();
  if (!latest) return aside(panel, "nothing yet");

  if (showing === "context") {
    if (!latest.items.length) return aside(panel, "the context is empty");
    for (const item of latest.items) {
      // what it costs the request it is in, or why it is in none of it. The two are one answer:
      // every item is either going for some number of tokens or held back for a reason
      const held = item.going === null || item.going === undefined;
      const figures =
        `${item.kind} · ~${item.tokens.toLocaleString()} tokens · ${item.state}` +
        (held ? "" : ` · ${item.going.toLocaleString()} in the next request`) +
        (item.uncounted ? ` · ${item.uncounted} unpriced` : "");
      const el = row(panel, `${item.id} ${item.label}`, figures, item.left_out ?? item.marker);

      // the state, and the way to change it. One button rather than three, because the session
      // owns the ring and what it writes beside each step - see `Command::cycle`. What the button
      // says is where the item *is*, so a row reads as a fact and the tap is what changes it
      const state = document.createElement("button");
      state.type = "button";
      state.className = `state ${item.state}`;
      state.textContent = item.state;
      state.title = "the next state: active, elided, excluded";
      state.onclick = (e) => {
        // the row toggles its body and this is inside the row, so without this a tap that changes
        // a state also opens whatever it changed
        e.stopPropagation();
        send({ do: "cycle", id: item.id });
      };
      el.querySelector(".head").append(state);

      // the row says what the item is; `inspect` is the only way to what it holds, because the
      // projection names items rather than carrying them
      el.classList.add("act");
      const body = document.createElement("div");
      body.className = "body";
      el.append(body);
      el.onclick = () => {
        el.classList.toggle("open");
        if (body.textContent) return;
        body.textContent = "…";
        // `data-body` rather than `data-item`, which the chat uses for the line that *is* the
        // item. One `inspect` answer fills both, and a row opened here would otherwise overwrite
        // the chat's own line with the item's whole rendering
        body.dataset.body = item.id;
        send({ do: "inspect", id: item.id });
      };
    }
    return;
  }

  // the trace, which is the trace tab: the session's events in this program's own words, with the
  // gap beside the ones that took any time. Both are the session's - the wording because a second
  // set written here would be a vocabulary nobody at the other end could see, and the gap because
  // when there *is* one is a decision rather than a format
  if (showing === "events") {
    if (!latest.trace.length) return aside(panel, "nothing has happened yet");
    for (const event of latest.trace) {
      const when = new Date(event.at).toLocaleTimeString();
      // a line with no name is more of what the one above had to say, so it is drawn under it
      // rather than as an event of its own
      if (!event.name) {
        const more = document.createElement("div");
        more.className = "detail";
        more.textContent = event.detail;
        (panel.lastElementChild ?? panel).append(more);
        continue;
      }
      const el = row(panel, event.name, when, null);
      if (event.gap) {
        const gap = document.createElement("div");
        gap.className = "gap";
        gap.textContent = event.gap;
        el.querySelector(".head").append(gap);
      }
      if (event.detail) {
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = event.detail;
        el.append(detail);
      }
    }
    panel.scrollTop = panel.scrollHeight;
    return;
  }

  // the sandbox first, because a confinement that is not there has to say so where the rules are
  // read, and a rule read as though it were enforced is worse than no rule
  //
  // note: named rather than left as the fall-through it was. A view this does not know about is a
  // bug, and drawing the permissions at it is the kind that looks like a feature
  if (showing !== "permissions") return;
  aside(panel, latest.confinement ?? "no sandbox: the tools reach whatever this user can");
  // and what is *not* listed, for the reason the terminal's tab gives: rows for subjects nobody
  // has thought about are not information, and a list that quietly stood for them would be
  aside(panel, `${latest.undecided} more subject(s) nobody has decided, so each is asked about`);
  if (!latest.permissions.length) return;
  for (const rule of latest.permissions) {
    const covers = rule.tools.length ? rule.tools.join(", ") : "nothing registered needs it";
    const sometimes = rule.sometimes.length ? ` · sometimes ${rule.sometimes.join(", ")}` : "";
    const el = row(panel, rule.subject, `${covers}${sometimes}`);
    const verdict = document.createElement("span");
    verdict.className =
      rule.verdict === "allow" ? "allowed" : rule.verdict === "deny" ? "denied" : "asks";
    verdict.textContent = ` ${rule.verdict}`;
    el.querySelector(".name").append(verdict);
  }
}

/** A line of the panel's own, for when there are no rows to draw. */
function aside(into, text) {
  const el = document.createElement("p");
  el.className = "empty";
  el.textContent = text;
  into.append(el);
}

function showQuestion() {
  const next = asking[0];
  question.classList.toggle("open", !!next);
  prompt.style.display = next ? "none" : "flex";
  // the tab strip goes red upstairs and this is the same sentence: from another view a question is
  // not what you are looking at, but it is the thing the session has stopped for
  document.getElementById("view").classList.toggle("asked", !!next);
  if (next) {
    asked.textContent =
      `${next.tool}(${JSON.stringify(next.args)})\nit declares ` +
      (next.capabilities.length ? next.capabilities.join(", ") : "nothing");
  }
}

document.getElementById("answers").onclick = (e) => {
  const grant = e.target.dataset.grant;
  if (!grant || !asking.length) return;
  send({
    do: "decide",
    id: asking[0].id,
    grant: grant === "deny" ? "deny" : "allow",
    remember: grant === "always",
  });
};

prompt.onsubmit = (e) => {
  e.preventDefault();
  const text = line.value.trim();
  if (!text) return;
  line.value = "";
  line.style.height = "auto";
  // drawn here rather than waiting for the record, because the record will not carry the words -
  // this page is the only thing that knows them until it asks - and because a line sent into a
  // running turn is queued, and would be invisible until that turn ended. `claim` is what stops
  // it being drawn again when it does become an item
  pending.push(say("user", text));
  send({ do: "submit", line: text });
};

// enter sends, shift+enter is a newline; and the box grows with what is in it
line.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    prompt.requestSubmit();
  }
});
line.addEventListener("input", () => {
  line.style.height = "auto";
  line.style.height = Math.min(line.scrollHeight, window.innerHeight * 0.3) + "px";
});

/** Everything the session says, one message at a time. */
function heard(m) {
  switch (m.is) {
    case "attached": {
      // whatever this page had drawn belongs to the conversation it is about to be handed
      latest = m;
      stale = false;
      // note: the session's name is not up here, and it is a timestamp - which is the one thing in
      // the header nobody reads twice and the widest thing on a phone. It is still what the record
      // is filed under and what `/save` writes, and `setup` says it
      document.getElementById("model").textContent = m.model ? m.model.model : "no model";
      budget(m);
      if (showing !== "chat") draw();
      streaming = m.busy;
      conversation(m.conversation);
      asking = m.asking;
      showQuestion();
      working(m.busy);
      break;
    }
    case "record": happened(m.event); break;
    case "progress": {
      // note: dropped unless something is actually arriving, and that is not a nicety. A fragment
      // is unnumbered and best-effort, so a connection that has fallen behind is handed one *after*
      // the record that ends the answer it belonged to - the server says so in as many words. A
      // page that took those anyway started a second bubble underneath whatever had been drawn
      // since, which is how one answer came to be shown twice, and how another arrived in two
      // pieces with a message typed in between them. The terminal drops the same fragments under
      // the name `Entry::transient`: once the item exists, the item is what says what was said
      if (m.event.event === "model.delta" && m.event.delta.text !== undefined && streaming) {
        if (!open) open = say("model", "");
        open.textContent += m.event.delta.text;
        log.scrollTop = log.scrollHeight;
      }
      break;
    }
    case "projected": {
      latest = m;
      budget(m);
      if (showing !== "chat") draw();
      // and the chat, where something moved and the stream could not say what that did to it.
      // Held back while a model is typing or a line of this page's own has not become an item
      // yet, because a rebuild takes both away: the bubble the fragments are going into is
      // replaced, and a message sent a moment ago is not in any projection until it is recorded.
      // `stale` stays set, and the end of the turn asks again
      if (stale && !streaming && !pending.length) {
        stale = false;
        conversation(m.conversation);
      }
      break;
    }
    case "said": say(m.speaker === "error" ? "error" : "note", m.text); break;
    // what `/clear` and `ctrl+l` take off a terminal, taken off this page: the program's own lines
    // and nothing else. The conversation stays, because it is the context and this did not touch it
    case "cleared": {
      for (const el of log.querySelectorAll(".note, .error")) el.remove();
      break;
    }
    case "item": {
      // both places one can be wanted: the chat line that is the item, and a context row somebody
      // has opened. They are different attributes because they are different things - the line is
      // the item and the row merely names it - and one answer fills whichever exist
      for (const el of log.querySelectorAll(`[data-item="${m.id}"]`)) {
        el.textContent = m.body;
        el.classList.remove("pending");
      }
      for (const el of document.querySelectorAll(`[data-body="${m.id}"]`)) {
        el.textContent = m.body;
      }
      break;
    }
    case "busy": working(m.busy); break;
    case "replied": {
      working(m.busy);
      if (m.did && m.did.asked !== undefined) claim(m.did.asked);
      if (m.page) for (const p of m.page.pages) say("note", `--- ${m.page.title} ---\n${p.body}`);
      break;
    }
    case "missed": say("note", `${m.frames} fragment(s) went past too fast; the records have what happened`); break;
    case "failed": say("error", `${m.about}: ${m.error}`); break;
  }
}

/** One thing that happened, out of a record. */
function happened(e) {
  // anything that touched the context makes the rows on screen stale, whoever touched it - this
  // page, somebody at the terminal, or the model through its own `context` tool. Asked for rather
  // than patched in, because what the columns say is worked out by projecting
  // the context view's figures go stale on anything that touched the context, and the trace on
  // anything at all - it is the log of everything, so every record is a line of it
  if (showing === "events" || (showing === "context" && e.event.startsWith("context."))) {
    send({ do: "project" });
  }
  // and a subset of those changed the *conversation*, which every view owes a rebuild. Not
  // `context.added`, which is the one the appending below already draws, and not `annotated` or
  // `recounted`, which move a figure and not a line
  if (RESHAPES.has(e.event)) restale();
  switch (e.event) {
    case "context.added":
      // a message: this page's own, or somebody else's. `claim` answers which - it binds the line
      // drawn on sending, and says so - and only what nobody here typed is worth asking about. The
      // record says an item exists and not one word of what it holds, which is where `inspect`
      // earns its place
      if (e.kind === "user_message" && !claim(e.id)) inspect(e.id, "user");
      break;
    // a request is on its way, so whatever arrives next belongs to it and nothing before it does
    case "model.requested": open = null; streaming = true; break;
    case "tool.requested": say("call", `${e.tool}(${JSON.stringify(e.args)})`); break;
    case "tool.finished":
      say("result", `${e.tool}: ${e.tokens} tokens${e.is_error ? ", an error" : ""}`);
      break;
    case "permission.requested": asking.push(e.request); showQuestion(); break;
    case "permission.decided":
      asking = asking.filter((q) => q.id !== e.id);
      showQuestion();
      say("note", `${e.tool}: ${e.grant}`);
      break;
    case "model.finished": {
      // the fragments were the live half and are over; the item is what was kept, and the item is
      // what the chat shows from here. That is `Entry::transient` upstairs - the terminal drops
      // every streamed line the moment the turn is recorded and reads the context instead - and
      // this page used to keep whatever had arrived, which is wrong in two ways a person sees.
      // A fragment is unnumbered and best-effort, so a page that fell behind kept a *truncated*
      // answer for good; and the fragments are what the provider sent, byte for byte, so an answer
      // that began with two blank lines began with two blank lines, where the context trims them
      streaming = false;
      if (open) { open.dataset.item = e.item; open = null; }
      restale();
      break;
    }
    case "context.compacted": say("note", "the context was compacted"); break;
    case "session.finished": say("note", "the session ended"); break;
  }
}

function budget(m) {
  const used = m.budget.context_tokens + m.budget.tool_tokens;
  const of = m.budget.limit ? ` of ${m.budget.limit.toLocaleString()}` : "";
  const spent = m.spend ? `, ${m.spent.toLocaleString()}/${m.spend.toLocaleString()} spent` : "";
  document.getElementById("budget").textContent = `~${used.toLocaleString()}${of}${spent}`;
}

function working(busy) {
  // a rebuild held back while the model was typing is owed the moment it stops. See the
  // `projected` case for why it is held back rather than done and undone
  if (!busy && stale) send({ do: "project" });
  document.getElementById("pulse").hidden = !busy;
  document.getElementById("busy").textContent = busy ? "working…" : "";
  line.disabled = false; // a line typed into a running turn waits for it, which is the session's job
}

// note: no reconnection anywhere in this file. `EventSource` does it, and sends `Last-Event-ID` -
// the last record this page was given - which the gateway hands to the session as `attach
// { since }`. The whole of resume, for nothing
// note: anything this page throws goes on the page, because the alternative is what it looked like
// the first time something did: a blank screen and nothing to go on
window.onerror = (message, src, line) => { say("error", `${message} (${src}:${line})`); };

// note: the class on `body` is what the stylesheet reads to decide which view is showing, and
// `show` is the only thing that sets it - so a page that never called it started with no class at
// all, which `body:not(.chat)` reads as "not the chat": the conversation and the prompt were both
// hidden until somebody cycled all the way round to chat and set it. The invariant is that
// `showing` and the class always agree, and this is where it starts being true
show("chat");

const events = new EventSource(`/events?tab=${tab}`);
events.onmessage = (e) => heard(JSON.parse(e.data));
events.onerror = () => {
  document.getElementById("busy").textContent = "reconnecting…";
};
</script>
