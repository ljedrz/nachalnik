      toggles && asksShown
        ? `listing the ${latest.undecided} it asks about`
        : `${latest.undecided} more it will ask about`,
    );
  }
  if (!footer.length) return;
  // the line, with the toggle at its right-hand end where there is anything to list
  const bottom = document.createElement("div");
  bottom.className = "bottom";
  aside(bottom, footer.join(" · "));
  if (toggles) {
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.textContent = "toggle";
    toggle.title = "show or hide what it asks about among the rules";
    toggle.setAttribute("aria-pressed", String(asksShown));
    toggle.onclick = () => {
      asksShown = !asksShown;
      draw();
    };
    bottom.append(toggle);
  }
  panel.append(bottom);
}

/** Whether the permissions list shows what it asks about beside what has been decided; off to
 *  begin with, as on the tab, and kept across the redraw every projection makes. */
let asksShown = false;

/** The parts of the sandbox somebody opened to list their paths, by name. */
const openedParts = new Set();

/** The class each verdict is drawn in, so one word is one colour wherever it appears. */
const verdicts = { allow: "allowed", deny: "denied", ask: "asks" };

/** A line of the panel's own, for when there are no rows to draw. */
/**
 * Whether a context row is left in by the filter above the view and its `sent only`.
 *
 * note: the session decides what the filter leaves, not this page, because a row carries what an
 * item is and not what it says - and a filter worth having reads the whole of an item, its
 * reasoning and calls among it. The session answers with the terminal's own matcher, so `/` there
 * and the box here leave the same rows: fuzzy, and case ignored unless there is a capital in it.
 * Until the first answer arrives nothing is hidden, and until a newer one does the last stands.
 *
 * note: `sent only` is the terminal's `f`: what the next request sends whole, so neither what it
 * leaves out nor what it sends as an elision marker.
 */
function sifted(item) {
  if (sentOnly && (item.going === null || item.going === undefined || item.state === "elided")) {
    return false;
  }
  if (!sift.value.trim() || !found) return true;
  return found.has(item.id);
}

const sift = document.getElementById("filter");
let sentOnly = false;
/** The items the session last said the filter leaves, by identifier; `null` for none asked yet. */
let found = null;

/**
 * Asks the session what the filter leaves, where it says anything.
 *
 * note: asked again on every projection while the box has something in it, because a projection
 * is what an item changing looks like from here, and a match is about what the item says.
 */
function search() {
  const query = sift.value.trim();
  if (!query) {
    found = null;
    return draw();
  }
  send({ do: "search", query });
}
sift.oninput = search;
document.getElementById("sent").onclick = (e) => {
  sentOnly = !sentOnly;
  e.currentTarget.setAttribute("aria-pressed", String(sentOnly));
  draw();
};

function aside(into, text) {
  const el = document.createElement("p");
  el.className = "empty";
  el.textContent = text;
  into.append(el);
}

function showQuestion() {
  const next = asking[0];
  // a running command that reached for the network is the other kind, and the kernel's comes first
  // where both are waiting, as it does on the terminal's panel
  const reached = !next && reaching[0];
  question.classList.toggle("open", !!(next || reached));
  prompt.style.display = next || reached ? "none" : "flex";
  // the tab strip goes red upstairs and this is the same sentence: from another view a question is
  // not what you are looking at, but it is the thing the session has stopped for
  document.getElementById("view").classList.toggle("asked", !!(next || reached));
  indicator();
  if (next) {
    asked.textContent =
      `${next.tool}(${JSON.stringify(next.args)})\nit declares ` +
      (next.capabilities.length ? next.capabilities.join(", ") : "nothing");
  } else if (reached) {
    asked.textContent =
      `${reached.cmd}\nis running and has reached for the network; the answer holds for the rest ` +
      "of it, and \"always\" allows the network from now on";
  }
  band(next);
  attention.asked(next ? `q${next.id}` : reached ? `r${reached.id}` : null, asked.textContent);
}

/**
 * A notification for a question that arrives while nobody is looking at the page, where this
 * browser was asked for one.
 *
 * note: off unless somebody turns it on in the `Aa` panel, because a browser asks for permission
 * and that question should come from a click, not from a page that has just opened. The toggle is
 * there only where notifications can work at all: a browser that has them, on a page served
 * securely, which `localhost` and `https` are and a plain `http` address on a network is not.
 *
 * note: once per question, and only while the page is hidden. The tab title already says a question
 * is waiting to somebody who can see the tab, and a question still on screen after a rebuild is not
 * a new one.
 */
const attention = (() => {
  const KEY = "kamchatka.notify";
  const row = document.getElementById("notifying");
  const box = document.getElementById("notify");
  const able = "Notification" in window && window.isSecureContext;
  let told = null;
  const wanted = () => {
    try { return localStorage.getItem(KEY) === "1"; } catch { return false; }
  };
  const keep = (on) => {
    try { on ? localStorage.setItem(KEY, "1") : localStorage.removeItem(KEY); } catch { /* not kept */ }
  };

  row.hidden = !able;
  box.checked = able && wanted() && Notification.permission === "granted";
  box.onchange = async () => {
    if (!box.checked) return keep(false);
    // asked here, from the click, which is the one moment a browser will show its question
    const answer = await Notification.requestPermission();
    box.checked = answer === "granted";
    keep(box.checked);
  };

  return {
    /** Notes which question is on screen now, and tells somebody about a new one if asked to. */
    asked(id, text) {
      if (id === told) return;
      told = id;
      if (!id || !box.checked || !document.hidden) return;
      try {
        const note = new Notification("kamchatka is waiting for an answer", {
          body: text.split("\n")[0],
          tag: "kamchatka-question",
        });
        note.onclick = () => { window.focus(); note.close(); };
      } catch { /* a browser that will only notify from a service worker says nothing */ }
    },
  };
})();

/**
 * What the advisor made of the command, above the command.
 *
 * note: the words come down the wire and this picks a colour, which is the division the terminal
 * draws too - the page does not know where the thresholds are, does not see the score, and cannot
 * end up disagreeing with the sentence it is printing. A session with no advisor sends no rows and
 * this draws nothing, which is the same absence a terminal shows.
 *
 * note: the percentage is on the line because the band is not a fact about the command. An unsure
 * reading is never sent green, so a yellow one may be yellow because the command changes something
 * or yellow because nothing could be told - and those are not the same warning.
 */
function band(next) {
  const seen = next && (latest?.rated ?? []).find((it) => it.id === next.id);
  // asked and not answered says so, rather than drawing what a question nobody rated looks like:
  // what the advisor's endpoint refuses is the commands most worth a colour
  const missed = !seen && next && (latest?.unrated ?? []).find((it) => it.id === next.id);
  rating.hidden = !seen && !missed;
  if (missed) {
    rating.className = "";
    rating.textContent = "the advisor could not rate this: ";
    const why = document.createElement("span");
    why.className = "why";
    why.textContent = missed.why;
    rating.append(why);
    return;
  }
  if (!seen) return;

  rating.className = seen.band;
  rating.textContent = `the advisor reads this as: ${seen.said}`;
  const sure = document.createElement("span");
  sure.className = "sure";
  sure.textContent = ` · ${Math.round(seen.confidence * 100)}% sure`;
  rating.append(sure);
}

document.getElementById("answers").onclick = (e) => {
  const grant = e.target.dataset.grant;
  if (!grant || !(asking.length || reaching.length)) return;
  // `s` at the terminal: every call waiting is dropped and the turn ends there, or, at a running
  // command's question, the turn is stopped. Sent as `/stop`, which does both
  if (grant === "stop") {
    send({ do: "submit", line: "/stop" });
    return;
  }
  send({
    // note: two commands because the two questions are numbered by different things - the kernel's
    // by the kernel, a running command's by the policy holding it - and the one on the panel is
    // the one being answered
    do: asking.length ? "decide" : "reach",
    id: asking.length ? asking[0].id : reaching[0].id,
    grant: grant === "deny" ? "deny" : "allow",
    remember: grant === "always",
  });
};

prompt.onsubmit = async (e) => {
  e.preventDefault();
  const text = line.value.trim();
  if (!text) {
    // the button says `stop` exactly when this is what it does; see `button`
    if (turning) stop();
    return;
  }
  line.value = "";
  line.style.height = "auto";
  // a command is sent and not drawn, as the terminal never shows a typed command in the chat; what
  // it leads to is said back, and that is drawn
  if (text.startsWith("/")) {
    if (!(await send({ do: "submit", line: text })) && !line.value) line.value = text;
    return;
  }
  // drawn here rather than waiting for the record, because the record will not carry the words -
  // this page is the only thing that knows them until it asks - and because a line sent into a
  // running turn is queued, and would be invisible until that turn ended. `claim` is what stops
  // it being drawn again when it does become an item
  const drawn = say("user", text);
  pending.push(drawn);
  // and taken back where the gateway would not take it. A line drawn optimistically is a promise
  // this page can keep or break in one round trip, and the reader's own words are the one thing
  // they will assume arrived. It goes back in the box, because what somebody wants after a line
  // that did not send is to send it again
  if (!(await send({ do: "submit", line: text }))) {
    pending.splice(pending.indexOf(drawn), 1);
    drawn.remove();
    if (!line.value) line.value = text;
  }
};

// enter sends, shift+enter is a newline, as in the terminal; and the box grows with what is in it.
// On a touch screen enter is a newline and only the button sends: a phone's keyboard has no shift
// to hold with enter, so an enter that sent would leave it no way to break a line at all.
// note: asked at every key rather than once, because a tablet can gain or lose its mouse while the
// page is open
const touch = matchMedia("(pointer: coarse)");
line.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !touch.matches) {
    e.preventDefault();
    prompt.requestSubmit();
  }
});
line.addEventListener("input", () => {
  line.style.height = "auto";
  line.style.height = Math.min(line.scrollHeight, visible() * 0.3) + "px";
  button();
});

/**
 * Stops the running turn, as `esc` and `/stop` do at the terminal: whatever arrived is kept.
 *
 * note: `interrupt` rather than a `/stop` line, because that is the command for it and has been in
 * the protocol all along. A `/stop` typed into the box still works, as any line does.
 */
function stop() {
  send({ do: "interrupt" });
}

/**
 * Says on the prompt's button what pressing it does: `stop` while a turn runs and the box is empty,
 * `send` otherwise.
 *
 * note: `send` again as soon as anything is typed, because a line sent into a running turn waits
 * for it and gets a turn of its own, as at the terminal. One button rather than two keeps the
 * footer one row on a phone; the colour is the one the question's `stop` has.
 */
function button() {
  const stopping = turning && !line.value.trim();
  const el = document.getElementById("send");
  el.textContent = stopping ? "stop" : "send";
  el.classList.toggle("stop", stopping);
  el.title = stopping ? "stop the turn and keep what has arrived, as esc does" : "";
}

// `esc` stops a running turn from the prompt or from nowhere in particular, as at the terminal,
// unless something on the page has already used it.
//
// note: not from another box. In the filter `esc` is how a browser clears it, and at the terminal
// `esc` in a search box closes the box rather than stopping anything; a turn ended by somebody
// clearing a filter is a turn they did not mean to end
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented || !turning) return;
  const typing = e.target instanceof HTMLElement && e.target.matches("input, textarea, select");
  if (typing && e.target !== line) return;
  stop();
});

/** Everything the session says, one message at a time. */
function heard(m) {
  switch (m.is) {
    case "attached": {
      // whatever this page had drawn belongs to the conversation it is about to be handed
      latest = m;
      stale = false;
      // note: the session's name is not up here. It is a timestamp, which nobody reads twice and
      // which would be the widest thing on a phone; it is still what the record is filed under
      named(m.model);
      budget(m);
      if (showing !== "chat") draw();
      if (sift.value.trim()) search();
      streaming = m.busy;
      conversation(m.conversation);
      asking = m.asking;
      reaching = m.reaching ?? [];
      showQuestion();
      paused = !!m.paused;
      working(m.busy);
      break;
    }
    // the whole list whenever it changes, since nothing numbers these on the stream
    case "reaching": reaching = m.waiting; showQuestion(); break;
    case "record": happened(m.event); break;
    case "progress": {
      // note: dropped unless something is actually arriving, and that is not a nicety. A fragment
      // is unnumbered and best-effort, so a connection that has fallen behind is handed one *after*
      // the record that ends the answer it belonged to, and says so: its `after` is that record. A
      // page that took those anyway would start a second bubble underneath whatever had been drawn
      // since, and show one answer twice, or in two pieces with a message typed in between them.
      // The terminal drops the same fragments under the name `Entry::transient`: once the item
      // exists, the item is what says what was said
      //
      // note: thinking as well as the answer, each in a line of its own, drawn the way the
      // projection draws them. With only the answer streamed, a model thinking for a minute showed
      // nothing but the dot, which looks the same as a model that has stopped - and a model going
      // round in circles in its thinking could not be seen doing it until the turn was over
      // the dot hears every fragment, including a tool call's arguments, which draw nothing here
      if (m.event.event === "model.delta") arrived();
      if (m.event.event === "model.delta" && streaming) {
        const delta = m.event.delta;
        const kind = delta.text !== undefined ? "model" : delta.reasoning !== undefined ? "reasoning" : null;
        if (!kind) break;
        // a change from thinking to answering, or back, starts a new line, as the item has them
        if (!open || !open.classList.contains(kind)) open = say(kind, "");
        if (kind === "model") answer = open;
        open.raw += delta.text ?? delta.reasoning;
        grown(open);
      }
      break;
    }
    case "projected": {
      latest = m;
      // note: the model as well as the figures. A projection is the only thing that knows what the
      // session is talking to *now*, and reading the budget off it alone would leave the name in
      // the header saying whatever it said when this page attached
      named(m.model);
      budget(m);
      paused = !!m.paused;
      offer();
      if (showing !== "chat") draw();
      if (sift.value.trim()) search();
      // and the chat, where something moved and the stream could not say what that did to it.
      // Held back while a model is typing or a line of this page's own has not become an item
      // yet, because a rebuild takes both away: the bubble the fragments are going into is
      // replaced, and a message sent a moment ago is not in any projection until it is recorded.
      // `stale` stays set, and the end of the turn asks again
      if (stale && !streaming && !pending.length) {
        stale = false;
        conversation(m.conversation);
      }
      // the ratings ride on a projection, so a question drawn before this arrived is a question
      // drawn without the one line it was waiting for. Only the band: the question itself came off
      // the stream and has not changed
      if (asking.length) band(asking[0]);
      break;
    }
    // the session is talking to something else now. Broadcast rather than answered to whoever
    // typed `/model`, because a session two people are watching is one session - and sent at all
    // because it is in no record: the switch finishes inside the provider the kernel already
    // holds, so there is nothing on the numbered stream to work it out from
    case "model": named(m.model); break;
    case "said": say(m.speaker === "error" ? "error" : "note", m.text); break;
    // what `/cleanup` and `ctrl+l` take off a terminal, taken off this page: the program's own
    // lines. The conversation stays, because it is the context and this did not touch it
    case "cleared": {
      for (const el of log.querySelectorAll(".note, .error")) el.remove();
      break;
    }
    case "item": {
      // both places one can be wanted: the chat line that is the item, and a context row somebody
      // has opened. They are different attributes because they are different things - the line is
      // the item and the row merely names it - and one answer fills whichever exist
      // note: routed by which question this answers, not only by which item it is about. Both
      // places are found by the same identifier and they want different readings - the chat wants
      // the item laid out, the context row wants the text an edit is made of - so an answer that
      // filled whichever it matched would put one in the other's place
      if (!m.raw) {
        for (const el of log.querySelectorAll(`[data-item="${m.id}"]`)) {
          fill(el, m.body);
          el.classList.remove("pending");
        }
      }
      // `value`, because a context row's body is the box an edit is typed into. `dataset.was` is
      // what arrived: an edit is what differs from it, so letting go of a box nobody touched
      // sends nothing, and a box still holding `…` is one that cannot be committed at all
      for (const el of document.querySelectorAll(`[data-body="${m.id}"]`)) {
        // the box that asked this question, which is not every box showing this item: most rows
        // ask for the text and a row no edit can be made of asks for the reading, and a version
        // answer belongs to the box that is on that version
        if (el.dataset.ask !== (m.raw ? "raw" : "reading")) continue;
        if (String(el.dataset.at ?? "") !== String(m.version ?? "")) continue;
        el.value = m.body;
        sized(el);
        const now = m.version === null || m.version === undefined;
        // and a baseline only for the text an edit can be made of. An old version or a reading
        // is read-only, so letting go of it has nothing to compare against and nothing to send
        if (m.raw && now) el.dataset.was = m.body;
        else delete el.dataset.was;
        // what the reply keeps beside its text, as it was at the version this box is on: a
        // rewrite of the reasoning is a version as a rewrite of the text is. A reading carries
        // neither, having both in its body already
        const thought = el.closest(".row")?.querySelector(`[data-thought="${m.id}"]`);
        if (thought) thought.shown(m.raw ? (m.reasoning ?? null) : null, m.calls ?? []);
      }
      break;
    }
    // only the answer to what the box says now: one goes out per keystroke, and they can cross
    case "found": {
      if (m.query !== sift.value.trim()) break;
      found = new Set(m.ids);
      if (showing === "context") draw();
      break;
    }
    case "copy": copied(m.id, m.text); break;
    // note: `paused` rides on `busy` because the two change together - a turn starting clears it
    // and a turn pausing sets it - and a session that predates it sends neither, which reads as
    // nothing to carry on
    case "busy": paused = !!m.paused; working(m.busy); break;
    case "replied": {
      working(m.busy);
      if (m.did && m.did.asked !== undefined) claim(m.did.asked);
      if (m.page) for (const p of m.page.pages) say("note", `--- ${m.page.title} ---\n${p.body}`);
      break;
    }
    case "missed":
      say("note", `${m.frames} fragment(s) went past too fast; the records have what happened`);
      // and what the session said meanwhile may be among what went past; the projection has it
      restale();
      break;
    // note: a reconnection. The records this page missed are sent again, but what the session said
    // is in no record, so a note said while the page was away - a phone with its screen off, say -
    // was lost: "the turn paused after 8 requests" among them, which is the one that needs an
    // answer. A projection holds the session's lines as well as the items, so the chat is drawn
    // again from one. A first attach is answered with the projection itself, not with this
    case "done":
      if (m.about === "attach") restale();
      break;
    case "failed": {
      say("error", `${m.about}: ${m.error}`);
      // note: replaced by another client, which the session serves instead of this one. Left to
      // reconnect by itself, this page would take the session back a second later, and the other
      // client would take it back again, for as long as both were open - so it stops, and a reload
      // is how somebody takes it back on purpose
      if (m.about === "replaced") {
        events.close();
        adrift = true;
        indicator();
      }
      break;
    }
  }
}

/** One thing that happened, out of a record. */
function happened(e) {
  // the context view's rows go stale on anything that touched the context, whoever touched it -
  // this page, somebody at the terminal, or the model through its own `context` tool - and the
  // trace on anything at all, because every record is a line of it. Asked for rather than patched
  // in, because what the columns say is worked out by projecting
  if (
    showing === "events" ||
    (showing === "context" && e.event.startsWith("context.")) ||
    (showing === "permissions" && e.event.startsWith("policy."))
  ) {
    send({ do: "project" });
  }
  // and a subset of those changed the *conversation*, which the chat owes a rebuild. Not
  // `context.added`, which is the one the appending below already draws, and not `annotated` or
  // `recounted`, which move a figure and not a line
  if (RESHAPES.has(e.event)) restale();
  switch (e.event) {
    case "context.added":
      // a message: this page's own, or somebody else's. `claim` answers which - it binds the line
      // drawn on sending, and says so - and only what nobody here typed is worth asking about. The
      // record says an item exists and not one word of what it holds, which is where `inspect`
      // earns its place
      if (e.kind === "user_message" && !claim(e.id)) inspect(e.id, "user");
      break;
    // a request is on its way, so whatever arrives next belongs to it and nothing before it does
    case "model.requested": open = answer = null; streaming = true; doing("waiting"); break;
    case "model.failed": doing(null); break;
    case "tool.started": running++; tool = e.tool; doing("tool"); break;
    case "tool.requested": say("call", `${e.tool}(${JSON.stringify(e.args)})`); break;
    case "tool.finished":
      running = Math.max(0, running - 1);
      if (!running && phase === "tool") doing(null);
      say("result", `${e.tool}: ${e.tokens} tokens${e.is_error ? ", an error" : ""}`);
      break;
    // note: and a projection asked for on the spot, because the advisor's reading of the command
    // is not in the session log - it is not an event, because it decided nothing - so it travels
    // beside the questions in a projection, and a question that arrived on the stream is a
    // question this page holds without one. Asked for here rather than waited for: `stale` is
    // settled at the end of a turn, and a turn is exactly what this has stopped in the middle of
    case "permission.requested":
      asking.push(e.request);
      showQuestion();
      send({ do: "project" });
      break;
    case "permission.decided":
      asking = asking.filter((q) => q.id !== e.id);
      showQuestion();
      say("note", `${e.tool}: ${e.grant}`);
      break;
    case "model.finished": {
      // the fragments were the live half and are over; the item is what was kept, and the item is
      // what the chat shows from here. That is `Entry::transient` upstairs - the terminal drops
      // every streamed line the moment the turn is recorded and reads the context instead - and
      // keeping whatever had arrived is wrong in two ways a person sees. A fragment is unnumbered
      // and best-effort, so a page that fell behind would keep a *truncated* answer for good; and
      // the fragments are what the provider sent, byte for byte, so an answer that began with two
      // blank lines would begin with two blank lines, where the context trims them
      streaming = false;
      doing(null);
      // the answer's line only, even where the thinking came last: an `item` answer fills every
      // line carrying the item with the answer, and a line of thinking filled with it would say
      // the answer twice
      if (answer) answer.dataset.item = e.item;
      open = answer = null;
      restale();
      break;
    }
    case "context.compacted": say("note", "the context was compacted"); break;
    case "session.finished": say("note", "the session ended"); break;
  }
}

/**
 * What the session is talking to, in the corner where it says so. A name that is a path to a model
 * file is shown as the file's name, as the terminal's status line shows it, and the whole name is
 * kept for hovering.
 */
function named(model) {
  const corner = document.getElementById("model");
  corner.textContent = model ? fileModel(model.model) : "no model";
  corner.title = model ? model.model : "";
}

/**
 * A model's name without the path and the `.gguf` that llama-server and vLLM put in it when they
 * loaded the model from a file, and without the part number of a split file. Any other name is
 * returned as it is. See `file_model` in `ui/mod.rs`, which this matches.
 */
function fileModel(name) {
  const gguf = /\.gguf$/i.test(name);
  const path = /^([\/~.]|[a-z]:[\/\\])/i.test(name);
  if (!gguf && !path) return name;
  let stem = name.replace(/[\/\\]+$/, "").split(/[\/\\]/).pop();
  if (gguf) stem = stem.slice(0, -".gguf".length);
  stem = stem.replace(/^(.+)-\d+-of-\d+$/, "$1");
  return stem || name;
}

// note: the session's own figure, which is the terminal's status line's - anchored on what the
// provider charged for the last request. Adding up the budget here showed the counter's raw estimate
// instead, and the two drifted apart as the session grew. The sum is only for a session that does
// not send the figure
function budget(m) {
  const used = m.expected ?? m.budget.context_tokens + m.budget.tool_tokens;
  const of = m.budget.limit ? ` of ${m.budget.limit.toLocaleString()}` : "";
  const spent = m.spend ? `, ${m.spent.toLocaleString()}/${m.spend.toLocaleString()} spent` : "";
  document.getElementById("budget").textContent = `~${used.toLocaleString()}${of}${spent}`;
}

function working(busy) {
  // a rebuild held back while the model was typing is owed the moment it stops. See the
  // `projected` case for why it is held back rather than done and undone
  if (!busy && stale) send({ do: "project" });
  if (!busy) { phase = null; running = 0; }
  turning = busy;
  indicator();
  offer();
  button();
  line.disabled = false; // a line typed into a running turn waits for it, which is the session's job
}

/**
 * Offers `continue` left of the prompt while a turn is paused at its request budget.
 *
 * note: hidden while a turn is running. A click starts a turn, and the `busy` that follows hides
 * the button, so a second click cannot start a second turn.
 */
function offer() {
  resume.hidden = !paused || turning;
}

resume.onclick = () => send({ do: "submit", line: "/continue" });

/** Notes what the running turn has started doing, for the dot. */
function doing(what) {
  phase = what;
  since = fragment = Date.now();
  indicator();
}

/** Notes that a fragment of the model's answer arrived, which is what keeps the dot lit. */
function arrived() {
  if (phase !== "waiting" && phase !== "sending") return;
  if (phase === "waiting") phase = "sending";
  fragment = Date.now();
  indicator();
}

/** How long ago `then` was, the way the tooltip says it. */
function ago(then) {
  const seconds = Math.floor((Date.now() - then) / 1000);
  return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
}

/** How long the model can send nothing before the dot dims. */
const QUIET_MS = 2000;

/**
 * Draws the one indicator there is.
 *
 * note: one dot, with its colour and its pulse saying what a turn is doing, and the tooltip
 * saying it in words. A word beside it is what made the header wrap - see the note on `#pulse`.
 * The phases come from the session's own events:
 * - a request out and nothing back yet, which on a local server is the prompt being read or a
 *   queue: the pulse
 * - the model answering: lit while fragments arrive, dim once none has for `QUIET_MS`
 * - a tool running, while the model server has nothing to do: the pulse, in another colour
 * - a question waiting on somebody: steady, in the colour of a person's lines
 *
 * A stream that has gone shows whether or not a turn is running, because it is the more urgent
 * and the turn carries on at the session either way.
 */
function indicator() {
  const dot = document.getElementById("pulse");
  // and while a question waits, when the session reports no turn running
  const asked = asking.length || reaching.length;
  dot.hidden = !turning && !adrift && !asked;
  let look = "", title = "working";
  if (adrift) {
    look = "down";
    title = "the stream went; picking it back up";
  } else if (asked) {
    look = "you";
    title = "waiting on you";
  } else if (phase === "waiting") {
    title = `asked the model ${ago(since)} ago; nothing back yet`;
  } else if (phase === "sending") {
    const quiet = Date.now() - fragment >= QUIET_MS;
    look = quiet ? "sending quiet" : "sending";
    title = quiet ? `the model has sent nothing for ${ago(fragment)}` : "the model is answering";
  } else if (phase === "tool") {
    look = "tool";
    title = `running ${tool} for ${ago(since)}`;
  }
  dot.className = look;
  dot.title = title;
  // and the tab's own title, which is all of the page somebody sees from another tab: a question
  // first, since the session has stopped for it, then a turn, then a stream that went
  document.title = `${asked ? "? " : adrift ? "✕ " : turning ? "● " : ""}kamchatka`;
  // ticking only while there is something for the time to change
  const ticks = turning && !adrift;
  if (ticks && !ticking) ticking = setInterval(indicator, 500);
  if (!ticks && ticking) { clearInterval(ticking); ticking = null; }
}

// note: anything this page throws goes on the page, because the alternative is a blank screen and
// nothing to go on
window.onerror = (message, src, line) => { say("error", `${message} (${src}:${line})`); };

// note: the class on `body` is what the stylesheet reads to decide which view is showing, and
// `show` is the only thing that sets it. A page with no class at all is one `body:not(.chat)`
// reads as "not the chat", with the conversation and the prompt both hidden. The invariant is that
// `showing` and the class always agree, and this is where it starts being true
show("chat");

const events = new EventSource(`${ROOT}events?tab=${tab}`);
events.onmessage = (e) => heard(JSON.parse(e.data));
// note: no reconnection anywhere in this file, and one place that stops it - a page replaced by
// another client, in `heard`. `EventSource` reconnects by itself and sends
// `Last-Event-ID` - the last record this page was given - which the relay hands to the session as
// `attach { since }`, so there is nothing to do here but say so. The saying is the dot going red,
// because a page that looks exactly the same whether or not it is still attached is the thing the
// indicator exists to stop
events.onerror = () => {
  adrift = true;
  indicator();
};
events.onopen = () => {
  adrift = false;
  indicator();
};

/**
 * How much of the page a person can actually see, in pixels.
 *
 * note: the *visual* viewport where there is one. `innerHeight` and `vh` are the layout viewport,
 * which a keyboard does not shrink - so both of them answer "the whole phone" while a third of the
 * phone is all there is, and anything sized from them grows off the bottom of the screen.
 */
function visible() {
  return window.visualViewport ? window.visualViewport.height : window.innerHeight;
}

// note: this is what keeps the prompt above the keyboard. A browser without `visualViewport`
// keeps the `100dvh` in the stylesheet and nothing more
if (window.visualViewport) {
  const fit = () => {
    // pinned before the height changes and restored after, because a shorter log keeps the scroll
    // offset it had - which on a conversation somebody was reading the end of is the end scrolling
    // away the moment they tap the box
    const pinned = log.scrollHeight - log.scrollTop - log.clientHeight < 4;
    document.documentElement.style.setProperty("--tall", `${Math.round(visible())}px`);
    // note: where the visible part *starts*, which is the half a height cannot say. A keyboard
    // shortens the visual viewport on Android and on iOS also slides it down the layout viewport,
    // and `window.scrollTo` below does not move that: it is an offset within the layout viewport
    // rather than a scroll of it. Left out, the page ends up exactly the right height and that
    // many pixels too high, with the prompt under the keyboard again
    document.documentElement.style.setProperty(
      "--lift",
      `${Math.round(window.visualViewport.offsetTop)}px`,
    );
    // note: and the page is put back to the top. A browser bringing a focused box into view scrolls
    // the *layout* viewport, which is the one that did not change - so the header goes off the top
    // and everything below it is that much further down, under the keyboard again. The page is
    // exactly the viewport and scrolls inside itself, so there is never anything out here to see
    window.scrollTo(0, 0);
    // the box's own ceiling is a share of what is visible, so a resize has to re-ask for it
    line.dispatchEvent(new Event("input"));
    if (pinned) log.scrollTop = log.scrollHeight;
  };
  // note: `scroll` as well as `resize`, because the two ways a keyboard can arrive are the viewport
  // getting shorter and the viewport being moved up the page, and a phone does whichever it likes
  window.visualViewport.addEventListener("resize", fit);
  window.visualViewport.addEventListener("scroll", fit);
  // note: and again after a box takes the focus, because a keyboard *animates* in. The first
  // resize a browser reports is measured part of the way through it, so a page that trusted it
  // would size itself to a keyboard half the height of the one that arrived, with the prompt
  // under it by the difference. Three re-measures in the next 600ms cost nothing and
  // catch whichever frame the animation settles on; `fit` only ever writes two numbers, so
  // running it again when nothing moved changes nothing
  document.addEventListener("focusin", () => {
    for (const after of [150, 350, 600]) setTimeout(fit, after);
  });
  fit();
}
</script>
