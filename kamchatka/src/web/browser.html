<!doctype html>
<meta charset="utf-8">
<!--
  `interactive-widget=resizes-content` is the half of the keyboard problem a browser can solve on
  its own: it asks for the on-screen keyboard to shrink the *layout* viewport as well as the
  visual one, which is what makes `100dvh` and ordinary flow put a footer above the keyboard
  rather than under it. The default is `resizes-visual`, where only the visual viewport moves and
  every viewport unit keeps answering "the whole phone".

  Chrome 108+ and Firefox 132+ honour it. Safari ignores it, and iOS Safari resizes neither the
  layout viewport nor `dvh` when the keyboard opens, so the script at the bottom is not redundant
  with this - it is the other half, and it is the half iOS needs.
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>kamchatka</title>

<!--
  The whole client. No build step, no framework, no bundler, no dependency - it is served by the
  web module (for `kamchatka --web` and the gateway example) out of an include_str!, and
  everything it knows about the session it learns from the protocol.

  * the conversation comes from a projection, and can come from nowhere else. The records name
    things rather than carrying them, so a page fed only the stream can follow a turn as it arrives
    and cannot render a word of what happened before it connected. The stream keeps the chat
    current between projections by appending; anything that changes its *shape* rather than its end
    - an item excluded, a compaction, an undo - asks for a new one and draws that.
  * anything it finds it has no text for - an item added by somebody else, an answer it missed
    while it was away - it asks for with `inspect`. That is the other half of the same decision.
  * it never reconnects. `EventSource` does that by itself, and sends `Last-Event-ID`, which the
    relay turns into `attach { since }`, so resuming takes no code here. What it does do is stop
    when another client replaces it, since a session serves one at a time.
  * a permission question takes the prompt's place rather than stacking above it, which is what the
    terminal does and for the same reason: the box the keys are in should be the box on the screen.
  * the four views are the terminal's tabs, in the terminal's order, drawn from what the terminal
    draws them from. Everything but the chat comes from a projection and asks for a fresh one on
    the way in, because none of it can be worked out from the stream: `going`, `left_out` and
    `marker` are answers about the *next request*, and the trace is the events in this program's
    own words. Writing either here would be a second
    vocabulary for one session, and it would be the one nobody at the other end can see.
  * the prompt is on the chat and nowhere else, which is where the terminal keeps it. A waiting
    question colours the cycler instead of following you about, the way the tab strip goes red
    upstairs.
-->

<style>
  /* note: one size and one family for the page, which every other size is a share of, so the
     text-size control scales the whole page at once and keeps its proportions. Set from script
     out of what this browser saved; see `typeface` */
  :root {
    --size: 15px;
    --family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --small: calc(var(--size) * 0.8);
    --between: calc(var(--size) * 0.87);
  }
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1c1b19; --dim: #6b6862; --line: #bdb6a9;
    --user: #2d4f6b; --note: #6b6862; --call: #6b4f2d; --bad: #8c2f22;
    /* the advisor's two lower bands; the top one is `--bad`, which is the page's one red and is
       the colour the terminal draws a grave command in too */
    --reads: #2f6b3d; --changes: #7a5512; --code: #1f5f6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513; --fg: #e8e4dc; --dim: #8a867e; --line: #4a443b;
      --user: #8fb8d8; --note: #8a867e; --call: #d0a878; --bad: #e08074;
      --reads: #86c396; --changes: #d8b45c; --code: #7cc4cf;
    }
  }
  /* note: `--line` is every border on the page - the header, the footer, a row's rule, the box you
     type in - and it is about 2:1 against the background in either scheme. Much fainter is a
     hairline on a good monitor and nothing at all on a phone in daylight; this is a line somebody
     can find without it reading as a heavy rule */
  * { box-sizing: border-box; }
  /* note: `--tall` is the *visual* viewport's height, set from script, and `100dvh` is the fallback
     for a browser without one. They are not the same viewport and the difference is the on-screen
     keyboard: `dvh` is the one the URL bar grows and shrinks, and a keyboard does not resize it
     unless `interactive-widget` above is honoured - so a footer pinned to the bottom of `100dvh`
     sits underneath the keyboard, with the prompt in it */
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: var(--size)/1.5 var(--family);
    height: var(--tall, 100dvh); display: flex; flex-direction: column;
    /* note: the *other* thing a keyboard does, and the one a height alone does not answer. A
       visual viewport can be moved down the page as well as made shorter - iOS scrolls one to
       bring the focused box into view - and `--lift` is how far. Without it the page is the right
       height and in the wrong place, which on a phone is the footer back under the keyboard.
       `position: relative` rather than a transform, which would make this the containing block
       for anything fixed later on */
    position: relative; top: var(--lift, 0px);
    /* the page is exactly the viewport and scrolls inside itself, so there is nothing out here for
       a browser to scroll when it decides to bring a focused box into view */
    overflow: hidden;
  }
  /* note: one row, always. A second row grows the header and pushes the chat and the prompt down
     the page, and a bar that moves the thing under it is worse than a bar that says less: what
     gives here is the model's name, which ellipsizes, because it is the one thing on the row that
     has no length anybody can predict */
  header {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; flex-wrap: nowrap; align-items: baseline;
    font-size: var(--small); color: var(--dim);
  }
  header b { color: var(--fg); font-weight: 600; }
  #model { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 3em; }
  #budget { white-space: nowrap; flex: none; }
  /* the cycler sits in the corner the tab strip is in upstairs, and the text control beside it
     takes the space left over */
  #view, #font {
    font-size: var(--small); padding: 4px 10px; min-height: 0;
    color: var(--dim); white-space: nowrap;
  }
  #font { margin-left: auto; }
  #font[aria-expanded="true"] { border-color: currentColor; }
  /* the text size and font, under the header's right-hand corner, over whatever view is open. A
     setting of this browser's, so nothing in it is sent to the session */
  #fonts {
    position: absolute; right: 12px; z-index: 2;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font-size: var(--small);
    display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 24px);
  }
  #fonts[hidden] { display: none; }
  #fonts .steps { display: flex; gap: 6px; align-items: center; }
  #fonts button { font-size: var(--small); padding: 2px 10px; min-height: 0; }
  #fonts select, #fonts input {
    font: inherit; font-size: max(16px, var(--small)); color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; max-width: 100%;
  }
  #fonts label { display: flex; flex-direction: column; gap: 4px; }
  #fonts label.toggle { flex-direction: row; align-items: center; }
  #send.stop { border-color: var(--bad); color: var(--bad); }
  /* note: `min-height: 0` because a flex item will not shrink below its content without it, and
     the log is the one thing here that must: when the box grows to three lines the room comes out
     of the conversation, never out of the footer, which is the half of the page somebody is
     touching */
  #log, #panel {
    flex: 1; min-height: 0; overflow-y: auto; padding: 12px; overscroll-behavior: contain;
  }
  #panel { display: none; }
  body:not(.chat) #log { display: none; }
  body:not(.chat) #panel { display: block; }
  /* the context view's filter, above the panel rather than in it: the panel is drawn again on every
     change, and a box drawn again is a box that loses what is being typed into it */
  #sift { display: none; gap: 6px; padding: 8px 12px 0; align-items: center; }
  body.context #sift { display: flex; }
  #sift input {
    flex: 1; min-width: 0; font: inherit; font-size: max(16px, var(--small)); padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit;
    min-height: 40px;
  }
  #sift button { font-size: var(--small); padding: 4px 10px; min-height: 40px; }
  #sift button[aria-pressed="true"] { border-color: currentColor; color: var(--fg); }
  /* note: no prompt anywhere but the chat, which is where the terminal keeps it too. A box that
     takes a line is a box on the chat, and a view that is a list of rows has nothing to say to one.
     What a waiting question does instead is colour the cycler, the way the tab strip goes red
     upstairs: from another view the question is not the thing you are looking at */
  body:not(.chat) footer { display: none; }
  #view.asked { border-color: var(--bad); color: var(--bad); }
  /* a row is the same shape on both of them: a name, some figures, and why */
  .row { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row.act { cursor: pointer; }
  /* the name takes the room and the button keeps its own, so a long path wraps rather than
     squeezing the one control on the row down to nothing */
  .head { display: flex; gap: 8px; align-items: flex-start; }
  .name { overflow-wrap: anywhere; flex: 1; min-width: 0; }
  /* the start of a message the person wrote, on one line beside its label, cut where the state
     button begins. The session already cut a long one, and says so with a `…`; this is the cut
     the width of the screen makes */
  .name.glimpsed { display: flex; white-space: nowrap; }
  .glimpse {
    overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-left: 0.5ch; color: var(--dim);
  }
  /* the trace view's rows, in the colours the trace tab draws them in; see `traced` */
  .name.failed { color: var(--bad); }
  .name.tool { color: var(--code); }
  .name.asked { color: var(--changes); }
  .state {
    font: inherit; font-size: var(--small); padding: 2px 8px; min-height: 0; border-radius: 4px;
    white-space: nowrap; flex: none;
  }
  .state.active { border-color: var(--user); color: var(--user); }
  .state.pinned { border-color: var(--fg); color: var(--fg); font-weight: 600; }
  .state.elided { border-color: var(--call); color: var(--call); }
  .state.excluded { border-color: var(--bad); color: var(--bad); }
  /* the same shape as the state button beside it, and quieter: the state is a control somebody
     reaches for and this is a label that happens to be one */
  .versions {
    font: inherit; font-size: var(--small); padding: 2px 8px; min-height: 0; border-radius: 4px;
    white-space: nowrap; flex: none; color: var(--dim);
  }
  /* anything but the current text, which is worth saying in the one colour the page keeps for
     "this is not what the next request sends" */
  .versions.past { border-color: var(--call); color: var(--call); }
  .figures { font-size: var(--small); color: var(--dim); margin-top: 2px; }
  /* the headings over the rules and the sandbox; the word for how open a part is, and the paths a
     part lists, folded away until somebody opens them as the tab's `enter` does */
  .section { margin: 18px 0 4px; font-weight: 600; }
  /* the sandbox is a second list rather than more rules, and right under the last rule's line it
     read as one more of them */
  .section.apart { margin-top: 40px; }
  .section .says { font-weight: 400; color: var(--dim); }
  /* the line along the bottom, with the toggle for what it asks about at its right-hand end */
  .bottom { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .bottom .empty { flex: 1; margin: 0; }
  .bottom button { flex: none; font-size: var(--small); padding: 2px 8px; min-height: 0; }
  .bottom button[aria-pressed="true"] { border-color: currentColor; }
  .kind { margin: 12px 0 0; font-style: italic; }
  .access { flex: none; font-size: var(--small); margin-left: 8px; }
  .paths { font-size: var(--small); color: var(--dim); margin-top: 4px; }
  .paths summary { cursor: pointer; }
  .paths div { padding-left: 16px; overflow-wrap: anywhere; font-family: monospace; }
  .why { font-size: var(--small); color: var(--note); margin-top: 2px; font-style: italic; }
  /* note: a `textarea` rather than a `div`, which is all it takes to make an item editable: the
     box shows what the item says, reads as something you can type into, and has somewhere for the
     typing to go. See `Command::Revise` */
  .body {
    display: none; margin-top: 8px; padding: 8px; white-space: pre-wrap;
    overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 6px;
    width: 100%; font: inherit; background: transparent; color: inherit; resize: vertical;
  }
  .row.open .body { display: block; }
  /* a box and the button that copies it, side by side: the box takes the width and the button
     keeps a size a thumb can hit */
  .boxed { display: none; gap: 8px; margin-top: 8px; align-items: flex-start; }
  .row.open .boxed { display: flex; }
  .boxed .body { display: block; margin-top: 0; flex: 1; min-width: 0; }
  .copy {
    flex: none; min-width: 44px; min-height: 44px; padding: 4px 10px; font-size: var(--small);
  }
  /* what a reply keeps beside its text: the thinking above the box, dim and italic as the chat
     draws it, and the calls under it. Both are read from the same answer as the text; see
     `Message::Item` */
  .thought { font-style: italic; color: var(--dim); }
  .parts {
    display: none; margin-top: 8px; font-size: var(--small); color: var(--dim);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row.open .parts { display: block; }
  .calls { font-family: monospace; }
  /* a part this item does not have, such as the text of a turn that is only calls. As specific as
     the rules that show the parts of an open row, and after them, so it wins over them */
  .row.open .absent { display: none; }
  /* the three shapes an edit cannot reach, and any earlier version, still open and still read -
     what they do not do is take typing they were never going to keep. `Listed::beyond` is what
     says which shapes, and says why */
  .body[readonly] { color: var(--dim); }
  .empty { color: var(--dim); white-space: pre-wrap; }
  .policy { margin: 0 0 10px; font-weight: 600; overflow-wrap: anywhere; }
  .detail { font-size: var(--small); color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }
  /* the figure being looked for, so it keeps the right-hand edge and a colour of its own. The
     verdicts are in the terminal's green, yellow and red, which are the advisor's bands here, so a
     word on the tab and the same word on this page are one colour */
  .allowed { color: var(--reads); } .asks { color: var(--changes); } .denied { color: var(--bad); }
  /* the three answers a row can be given, with the one it has pressed in. The words are the
     verdicts', since that is what the row reads back in */
  .rules { display: flex; flex: none; }
  .rules button {
    font-size: var(--small); padding: 2px 8px; min-height: 0; border-radius: 0; color: var(--dim);
  }
  /* neighbours share an edge by overlapping rather than by one of them losing its border, so the
     pressed one, drawn on top, has all four of its edges in its own colour */
  .rules button + button { margin-left: -1px; }
  .rules button:first-child { border-radius: 4px 0 0 4px; }
  .rules button:last-child { border-radius: 0 4px 4px 0; }
  .rules button[aria-pressed="true"] {
    opacity: 1; font-weight: 600; border-color: currentColor; position: relative; z-index: 1;
  }
  .rules button.allowed[aria-pressed="true"] { color: var(--reads); }
  .rules button.asks[aria-pressed="true"] { color: var(--changes); }
  .rules button.denied[aria-pressed="true"] { color: var(--bad); }
  .line { margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .line::before { color: var(--dim); }
  .user { color: var(--user); } .user::before { content: "> "; }
  .model::before { content: ""; }
  .reasoning { color: var(--dim); font-style: italic; } .reasoning::before { content: "~ "; }
  .call { color: var(--call); } .call::before { content: "\2329 "; }
  .result { color: var(--dim); } .result::before { content: "< "; }
  .note { color: var(--note); } .note::before { content: "\00b7 "; }
  .note button { font-size: var(--between); padding: 2px 10px; margin-left: 8px; }
  .error { color: var(--bad); } .error::before { content: "! "; }
  .pending { opacity: .45; }
  /* a model's answer, rendered as the terminal renders one: what the punctuation means rather than
     the punctuation. Weight and colour rather than slabs behind things, for the terminal's reason -
     a slab chosen against one background is a bruise on the other. `pre-wrap` stays on a
     paragraph, so a line the model broke is a line here too */
  .model > * { margin: 0 0 8px; }
  .model > :last-child { margin-bottom: 0; }
  .model p, .model li { white-space: pre-wrap; }
  .model .h1, .model .h2 { color: var(--changes); font-weight: 700; }
  .model .h1 { text-decoration: underline; }
  .model .h3 { font-weight: 700; }
  .model code { color: var(--code); }
  /* a rule down the left of a block rather than a slab behind it, which is the terminal's gutter */
  .model pre {
    white-space: pre; overflow-x: auto; padding: 2px 0 2px 10px;
    border-left: 2px solid var(--line); font: inherit;
  }
  .model pre code { color: inherit; }
  .model blockquote { margin-left: 0; padding-left: 10px; color: var(--dim); font-style: italic; }
  .model hr { border: 0; border-top: 1px solid var(--line); }
  .model ul, .model ol { padding-left: 2ch; }
  .model :is(li, blockquote) > * { margin: 0; }
  .line a { color: var(--user); }
  .model .table { overflow-x: auto; }
  .model table { border-collapse: collapse; }
  .model th, .model td { border: 1px solid var(--line); padding: 2px 8px; vertical-align: top; }
  .model th { font-weight: 700; }
  /* the program's voice on the end of somebody's line, so drawn the way a note is and not the way
     a thought is: on a reasoning line a dim italic would read as more of what the model thought */
  .clipped { color: var(--note); font-style: normal; font-size: var(--small); }
  footer {
    flex: none; border-top: 1px solid var(--line); padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  form { display: flex; gap: 8px; }
  /* 16px at least, or iOS zooms the whole page when the box is focused */
  textarea {
    flex: 1; resize: none; font: inherit; font-size: max(16px, var(--size)); padding: 8px;
    background: transparent; color: inherit;
    border: 1px solid var(--line); border-radius: 6px; min-height: 42px;
    /* a third of what is *visible*, not of the screen: `vh` is the layout viewport, which a
       keyboard does not shrink, and a third of the whole phone can be all that is left above the
       keyboard */
    max-height: calc(var(--tall, 100dvh) * 0.3);
  }
  button {
    font: inherit; font-size: var(--size); padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: inherit; min-height: 42px;
  }
  button:disabled { opacity: .4; }
  #question { display: none; }
  #question.open { display: block; }
  #question p { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* note: the band goes above the command rather than below it, which is where the terminal puts
     it and for the same reason: what it buys is the half-second before somebody reads the command,
     and a warning under the thing it is about is one that arrives after the reading it was meant
     to aim */
  #rating { font-weight: 600; }
  #rating .sure, #rating .why { font-weight: 400; color: var(--dim); }
  .reads { color: var(--reads); } .changes { color: var(--changes); } .grave { color: var(--bad); }
  #answers { display: flex; gap: 8px; flex-wrap: wrap; }
  #answers button { flex: 1; }
  .allow { border-color: var(--user); } .deny { border-color: var(--bad); }
  /* note: the corner a person's eye is already in, because the model's name is there and it is the
     first thing read. A turn can be a minute of nothing arriving - a model thinking, a command
     running, a provider gone quiet - and a page with no pulse in it is indistinguishable from a
     page whose connection died.
     note: and it is the whole of what the bar says about it. A word beside it would say what the
     dot already says, and cost the row the width that makes it wrap. What a turn is doing is told
     by colour and by whether the dot pulses, and the tooltip says it in words; see `indicator`.
     note: while the model is answering, the dot is lit by what arrives rather than by a timer, and
     dims when nothing has arrived for a while. A timed pulse looked the same over a server that
     was writing and one that had hung */
  #pulse { color: var(--call); animation: pulse 1.2s ease-in-out infinite; transition: opacity .6s; }
  #pulse.sending { animation: none; }
  #pulse.sending.quiet { opacity: .3; }
  #pulse.tool { color: var(--code); }
  #pulse.you { color: var(--user); animation: none; }
  #pulse.down { color: var(--bad); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  /* a reader who asked for no animation gets a steady dot, which still dims when the model goes
     quiet, without the fade */
  @media (prefers-reduced-motion: reduce) { #pulse { animation: none; transition: none; } }
</style>

<header>
  <span id="pulse" hidden>&#9679;</span>
  <b id="model">connecting…</b>
  <span id="budget"></span>
  <button id="font" type="button" aria-expanded="false" aria-controls="fonts"
          title="text size, font and notifications, for this browser">Aa</button>
  <button id="view" type="button" title="the next view: chat, context, events, permissions">chat</button>
</header>
<div id="fonts" hidden>
  <div class="steps">
    <button type="button" data-step="-1" title="smaller text">A&minus;</button>
    <span id="size"></span>
    <button type="button" data-step="1" title="larger text">A+</button>
    <button type="button" data-step="0" title="back to the size this page starts at">reset</button>
  </div>
  <label>font
    <select id="family">
      <option value="">monospace</option>
      <option value="system-ui, sans-serif">sans-serif</option>
      <option value="Georgia, 'Times New Roman', serif">serif</option>
      <option value="other">another, by name…</option>
    </select>
  </label>
  <input id="named" type="text" placeholder="a font on this device, e.g. Iosevka" hidden
         autocomplete="off" spellcheck="false">
  <!-- shown only where the browser can notify at all; see `attention` -->
  <label class="toggle" id="notifying" hidden>
    <input id="notify" type="checkbox"> notify me when a question waits and this page is hidden
  </label>
</div>

<div id="log"></div>
<div id="sift">
  <input id="filter" type="search" placeholder="filter" autocomplete="off" spellcheck="false"
         title="only the rows whose number, label, kind, state or start has this in it">
  <button id="sent" type="button" aria-pressed="false"
          title="only what the next request sends whole, leaving out the elided and the excluded">sent only</button>
</div>
<div id="panel"></div>

<footer>
  <form id="prompt">
    <!-- sends `/continue`; shown only while a turn is paused at its request budget, see `offer`.
         Left of the prompt rather than beside `send`, so it is the first thing seen -->
    <button id="continue" type="button" title="carry on the paused turn, as /continue does" hidden>continue</button>
    <textarea id="line" rows="1" placeholder="ask for something, or /help" autocomplete="off"></textarea>
    <!-- `stop` while a turn runs and the box is empty; see `button` -->
    <button id="send" type="submit">send</button>
  </form>
  <div id="question">
    <p id="rating" hidden></p>
    <p id="asked"></p>
    <div id="answers">
      <button class="allow" data-grant="allow">allow</button>
      <button class="allow" data-grant="always">always</button>
      <button class="deny" data-grant="deny">deny</button>
      <button class="deny" data-grant="stop">stop</button>
    </div>
  </div>
</footer>

<script>
// note: not `crypto.randomUUID()`, which only exists in a secure context; a page opened over plain
// http at anything but `localhost` is not one.
const tab = Math.random().toString(36).slice(2) + Date.now().toString(36);

const log = document.getElementById("log");
const prompt = document.getElementById("prompt");
const line = document.getElementById("line");
const question = document.getElementById("question");
const asked = document.getElementById("asked");
const rating = document.getElementById("rating");
const resume = document.getElementById("continue");

let asking = [];        // the questions waiting on somebody, oldest first
let reaching = [];      // the running commands waiting to hear whether they may reach the network
let open = null;        // the bubble a model is still writing into: its answer or its thinking
let answer = null;      // the last bubble of the answer itself, which the item is put on
let streaming = false;  // whether the fragments arriving still belong to anything
let wanted = new Set(); // items already asked about, so nothing is asked about twice
let pending = [];       // lines this page drew on sending, not yet tied to an item
let mine = new Set();   // the items those lines turned out to be
let latest = null;      // the last projection, which is what every view but the chat is drawn from
let stale = false;      // whether the chat no longer matches the context, and a rebuild is owed
let opened = new Set(); // the context rows the reader has expanded, which survive a rebuild
let owed = false;       // a rebuild held back because somebody is typing into an item
let showing = "chat";   // which of the four is on screen
let turning = false;    // whether a turn is running, which is half of what the one dot says
let paused = false;     // whether the last turn stopped at its request budget, waiting to carry on
let adrift = false;     // and whether the stream has gone, which is the other half
let phase = null;       // what the running turn is doing: "waiting", "sending", "tool" or null
let since = 0;          // when it started doing that
let fragment = 0;       // when the last fragment of the model's answer arrived
let running = 0;        // how many tools are running
let tool = "";          // the last of them to start
let ticking = null;     // the timer that keeps the dot's tooltip and dimming up to date

/**
 * The views, in the order the terminal's tab strip has them.
 *
 * note: the order is `Tab::ALL`, down to the event log sitting where the trace does rather than at
 * the end. Somebody who knows one of these two should not have to learn the other's habits, and
 * tab order is the cheapest kind of similarity there is.
 */
const VIEWS = ["chat", "context", "events", "permissions"];
// where the routes are: beneath the key this page was opened at, with or without its slash
const ROOT = location.pathname.endsWith("/") ? location.pathname : `${location.pathname}/`;

/**
 * The longest line the session sends, which is `protocol::MAX_LINE` on the other side of the relay.
 *
 * note: a copy, because the page has no other way to know it, and it needs it for one thing: to
 * tell a line cut down because the projection was too long, which the context view can fetch
 * whole, from one too long for any answer at all, which it cannot. Spelled out rather than as
 * `32 * 1024 * 1024` so that `tests/remote/refused.rs` can hold it to the Rust one by reading it.
 */
const MAX_LINE = 33554432;

/**
 * The records after which the chat is not what the context says any more.
 *
 * note: named rather than "anything context-shaped", because `context.added` is the one this page
 * already draws for itself as it arrives, and rebuilding on it would take the bubble a model is
 * writing into away every time a turn was recorded.
 */
const RESHAPES = new Set([
  "context.changed",
  "context.replaced",
  "context.reasoning_replaced",
  "context.undone",
  "context.redone",
  "context.compacted",
]);

/**
 * Says the chat no longer matches the context, and asks for what does.
 *
 * note: an item that changed state changed the conversation, and not in a way this page can work
 * out. An excluded item is gone from the chat; an elided one is still there in full, because
 * eliding is about what the *model* is sent and the marker is for it rather than for the person.
 * Which of those a given state means is `ContextState::is_projected`, over in the runtime, and a
 * page that reimplemented it would be a second copy of a rule the runtime can add cases to.
 *
 * note: a flag rather than a redraw, because the answer arrives later and may arrive at a bad
 * moment - see the `projected` case. Asking twice is cheap and rebuilding under a model that is
 * still typing is not.
 */
function restale() {
  stale = true;
  send({ do: "project" });
}

/**
 * Draws the conversation out of a projection, which is the only thing that knows its shape.
 *
 * note: this is what `attached` does and what a rebuild after a state change does, and they are
 * one function because they are one act. What it is *not* is a second account of the chat beside
 * the stream: the projection says what the conversation is, and the stream keeps it current
 * between projections by appending what has just happened. The moment the stream cannot - which
 * is any change to the *shape* rather than the end of it - this is what answers.
 */
function conversation(lines) {
  // note: the same question `say` asks, and for the same reason: somebody who has scrolled up to
  // read something is reading it, and a rebuild that yanked them back to the newest line would
  // make every recorded turn take the page away from them
  const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const was = log.scrollTop;
  log.replaceChildren();
  wanted.clear();
  pending = [];
  mine.clear();
  open = answer = null;
  for (const l of lines) {
    const el = say(l.speaker, l.text, l.item ?? undefined);
    if (l.clipped != null) clipped(el, l);
  }
  log.scrollTop = stuck ? log.scrollHeight : was;
}

/**
 * Says on the end of a line how much of it the projection left out, and where the rest is.
 *
 * note: a projection too long for one frame arrives with its longest lines cut down, each saying
 * by how much - see `Line::clipped` - and a line that read as the whole message when it was the
 * start of one would be this page telling somebody what was said and leaving half of it out. Where
 * the line is an item the context view reads it whole; where it is not, the count is all there is.
 *
 * note: a span of its own rather than more text, so that an `item` answer filling the line puts
 * the whole of it where the start was and the note goes with what it was about.
 */
function clipped(el, l) {
  const note = document.createElement("span");
  note.className = "clipped";
  const bytes = l.clipped.toLocaleString();
  // measured on the text rather than as JSON, so it is only ever right to say: a line longer than a
  // frame on its own is one no answer carries, and the context view asking for it is refused
  const whole = new TextEncoder().encode(l.text).length + l.clipped;
  note.textContent = l.item == null
    ? ` … ${bytes} more bytes not sent`
    : whole >= MAX_LINE
      ? ` … ${bytes} more bytes not sent, more than any one answer carries; \`/save\` writes a snapshot that holds it whole`
      : ` … ${bytes} more bytes not sent; the context view has the whole of item ${l.item}`;
  el.append(note);
}

/**
 * Sends one command. The answer comes back on the stream, not from here - but whether it was
 * *taken* comes back from here, and a line that was not taken has to say so. The page is careful
 * everywhere else not to tell the reader something happened when it did not, and a `fetch` whose
 * response is thrown away makes a 409, a 502 and a dead network all look like a command that
 * worked, with the typed line gone off the screen.
 */
async function send(command) {
  try {
    const answer = await fetch(`${ROOT}do?tab=${tab}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(command),
    });
    if (answer.ok) return true;
    say("error", `${command.do}: the gateway said ${answer.status} ${answer.statusText}`);
  } catch (e) {
    say("error", `${command.do}: ${e.message}`);
  }
  return false;
}

/** Adds a line, keeping the view at the bottom if it was already there. */
function say(kind, text, item) {
  const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  // a model's line holds blocks once it is rendered, and a `p` cannot
  const el = document.createElement(kind === "model" ? "div" : "p");
  el.className = "line " + kind;
  fill(el, text);
  if (item !== undefined) el.dataset.item = item;
  log.append(el);
  if (stuck) log.scrollTop = log.scrollHeight;
  return el;
}

/**
 * Puts a text into a line: as markdown if the line is the model's, and as it came otherwise.
 *
 * note: the model's lines only, which is what the terminal renders. A call's arguments, a result
 * and the program's own notes are not markdown, and rendering them as if they were would turn a
 * `*` in a glob into emphasis. `raw` keeps what was said, so a fragment arriving is appended to
 * the text rather than to whatever the text was drawn as.
 */
function fill(el, text) {
  el.raw = text;
  if (el.classList.contains("model")) el.replaceChildren(markdown(text));
  else el.replaceChildren(linked(text));
}

/**
 * A text with every web or mail address in it made a link, and nothing else changed.
 *
 * note: for the lines that are not markdown: a message, the thinking, a call, a note. Addresses are
 * the only thing turned into anything; the rest of the text stays as it is.
 */
function linked(text) {
  const out = document.createDocumentFragment();
  const starts = /https?:\/\/|mailto:/gi;
  let from = 0;
  for (let m; (m = starts.exec(text)); ) {
    const length = address(text, m.index);
    if (!length) continue;
    out.append(text.slice(from, m.index), link(text.slice(m.index, m.index + length)));
    from = starts.lastIndex = m.index + length;
  }
  out.append(text.slice(from));
  return out;
}

/**
 * How long the web or mail address starting at `at` is, or `0` where none starts there.
 *
 * note: the punctuation a sentence puts after an address is left out of it - the full stop in
 * "see https://example.com." - and so is a closing bracket with no opening one inside the address,
 * so "(https://example.com)" links the address and a Wikipedia address ending in `_(film)` keeps
 * its own. An address straight after a letter is part of a word and is not one.
 */
function address(text, at) {
  if (/[\p{L}\p{N}_]/u.test(text[at - 1] ?? "")) return 0;
  ADDRESS.lastIndex = at;
  const m = ADDRESS.exec(text);
  if (!m) return 0;
  let said = m[0];
  const count = (c) => said.split(c).length - 1;
  while (
    /[.,;:!?'"*_~]$/.test(said) ||
    (said.endsWith(")") && count("(") < count(")")) ||
    (said.endsWith("]") && count("[") < count("]"))
  ) {
    said = said.slice(0, -1);
  }
  // a scheme with nothing after it is a word, not an address
  return /^(https?:\/\/|mailto:)./i.test(said) ? said.length : 0;
}

/** Where an address may start, and every character it may hold. */
const ADDRESS = /(?:https?:\/\/|mailto:)[^\s<>"`]+/iy;

/**
 * A link to an address, opened in a tab of its own.
 *
 * note: only ever given an `http`, `https` or `mailto` address, which is the whole of what this
 * page links to; see `markdown`. A new tab, so following a link does not close the session's page.
 */
function link(href, label = href) {
  const a = document.createElement("a");
  a.href = href;
  a.rel = "noopener noreferrer";
  a.target = "_blank";
  a.append(label);
  return a;
}

/**
 * Puts text on this browser's clipboard; `false` where the browser would not.
 *
 * note: two ways, because neither works everywhere. `navigator.clipboard` exists only on a page
 * served over https or from localhost, and `execCommand("copy")` is the older way that works over
 * plain http. The focus goes back where it was, because selecting the hidden box takes it from the
 * line somebody is typing in.
 */
async function toClipboard(text) {
  if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (_) { /* refused; the older way may still work */ }
  }
  const focused = document.activeElement;
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.opacity = "0";
  document.body.append(area);
  area.select();
  let done = false;
  try { done = document.execCommand("copy"); } catch (_) { done = false; }
  area.remove();
  if (focused instanceof HTMLElement) focused.focus();
  return done;
}

/**
 * Copies an item that `/copy` sent back, or offers a button that does.
 *
 * note: the button is for browsers that only copy straight after a click or a key. The text
 * arrives a moment after Enter was pressed, which can already be too late; a click on the button
 * is a fresh one.
 */
async function copied(id, text) {
  if (await toClipboard(text)) {
    say("note", `[${id}] copied to this browser's clipboard`);
    return;
  }
  const el = say("note", `[${id}] is ready, but the browser only copies after a click`);
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = "copy";
  button.onclick = async () => {
    el.textContent = (await toClipboard(text))
      ? `[${id}] copied to this browser's clipboard`
      : `[${id}] was not copied: this browser would not allow it`;
  };
  el.append(button);
}

/** A line that a fragment has just grown, drawn again once per frame however many arrive in it. */
function grown(el) {
  if (el.owed) return;
  el.owed = true;
  requestAnimationFrame(() => {
    el.owed = false;
    // note: the same question `say` asks. A model can think for minutes, and a page that went to
    // the bottom on every frame of it kept pulling back somebody who had scrolled up to read
    const stuck = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    fill(el, el.raw);
    if (stuck) log.scrollTop = log.scrollHeight;
  });
}

/**
 * Markdown, as the terminal renders a model's answer: headings, emphasis, rules, lists, quotes,
 * code and tables, and nothing beyond them.
 *
 * note: built out of elements and text nodes, never out of a string of HTML. What is being drawn
 * was written by a model, which has read whatever its tools fetched, so a renderer that could be
 * talked into writing a tag would be a page anybody could script. A link is a link only where it
 * is `http`, `https` or `mailto`; anything else is its text.
 *
 * note: no highlighting in a fenced block, which the terminal does with a highlighter this page
 * has no copy of; the block keeps the rule down its left. An unterminated fence runs to the end,
 * because every block is unterminated for as long as it is still arriving.
 *
 * note: quotes and list items nest by calling this again, so past `DEEPEST` levels the rest is
 * drawn as it was written. A few thousand `> ` in one line - a few kilobytes a model can be handed
 * by anything it reads - ran out of stack, and since a whole conversation is drawn when the page
 * attaches, the error stopped the drawing there, before a waiting question was shown.
 */
const DEEPEST = 32;
function markdown(text, depth = 0) {
  const out = document.createDocumentFragment();
  if (depth > DEEPEST) {
    out.append(document.createTextNode(text));
    return out;
  }
  const lines = text.split("\n");
  const fence = (l) => l.match(/^ {0,3}(`{3,}|~{3,})\s*([^`\s]*)/);
  const heading = (l) => l.match(/^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/);
  const rule = (l) => /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/.test(l);
  const item = (l) => l.match(/^(\s*)([-*+]|\d{1,9}[.)])[ \t]+(.*)$/);
  const quote = (l) => /^ {0,3}>/.test(l);
  // the terminal's `is_delimiter`: a row of dashes, colons and pipes, with a pipe in it
  const delimiter = (l) => l.includes("|") && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l);
  const starts = (at) =>
    fence(lines[at]) || heading(lines[at]) || rule(lines[at]) || item(lines[at]) ||
    quote(lines[at]) || (lines[at].includes("|") && at + 1 < lines.length && delimiter(lines[at + 1]));

  let at = 0;
  while (at < lines.length) {
    const l = lines[at];
    if (!l.trim()) { at++; continue; }

    let m;
    if ((m = fence(l))) {
      const [marker, language] = [m[1], m[2]];
      const body = [];
      let closed = false;
      for (at++; at < lines.length && !closed; at++) {
        const closes = lines[at].match(/^ {0,3}(`{3,}|~{3,})\s*$/);
        closed = Boolean(closes && closes[1][0] === marker[0] && closes[1].length >= marker.length);
        if (!closed) body.push(lines[at]);
      }
      // a block still arriving ends wherever the text has got to, which is often a newline
      if (!closed && body.length && !body[body.length - 1].trim()) body.pop();
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      if (language) code.dataset.language = language;
      code.textContent = body.join("\n");
      pre.append(code);
      out.append(pre);
      continue;
    }
    if ((m = heading(l))) {
      const el = document.createElement("div");
      el.className = "h" + Math.min(m[1].length, 3);
      el.append(inline(m[2] ?? ""));
      out.append(el);
      at++;
      continue;
    }
    if (rule(l)) { out.append(document.createElement("hr")); at++; continue; }
    if (quote(l)) {
      const body = [];
      while (at < lines.length && quote(lines[at])) body.push(lines[at++].replace(/^ {0,3}> ?/, ""));
      const el = document.createElement("blockquote");
      el.append(markdown(body.join("\n"), depth + 1));
      out.append(el);
      continue;
    }
    if (l.includes("|") && at + 1 < lines.length && delimiter(lines[at + 1])) {
      const cells = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
      const table = document.createElement("table");
      const head = document.createElement("tr");
      for (const c of cells(l)) {
        const th = document.createElement("th");
        th.append(inline(c));
        head.append(th);
      }
      table.append(head);
      // a table runs until a line with no pipe in it, which is where the terminal ends one too
      for (at += 2; at < lines.length && lines[at].includes("|"); at++) {
        const tr = document.createElement("tr");
        for (const c of cells(lines[at])) {
          const td = document.createElement("td");
          td.append(inline(c));
          tr.append(td);
        }
        table.append(tr);
      }
      const wrap = document.createElement("div");
      wrap.className = "table";
      wrap.append(table);
      out.append(wrap);
      continue;
    }
    if ((m = item(l))) {
      // one list for a run of items, nested by how far each is indented; a line under an item
      // that starts nothing of its own is more of that item
      const ordered = /\d/.test(m[2]);
      const list = document.createElement(ordered ? "ol" : "ul");
      if (ordered && parseInt(m[2], 10) !== 1) list.start = parseInt(m[2], 10);
      const indent = m[1].length;
      // the same list goes on only as long as the items are the same kind at the same depth
      const same = (l) => {
        const it = item(l);
        return it && it[1].length === indent && /\d/.test(it[2]) === ordered ? it : null;
      };
      while (at < lines.length) {
        const here = same(lines[at]);
        if (!here) break;
        const body = [here[3]];
        for (at++; at < lines.length; at++) {
          const next = lines[at];
          const deeper = next.match(/^\s*/)[0].length > indent;
          if (!next.trim() || (item(next) && !deeper) || (!deeper && starts(at))) break;
          body.push(deeper ? next.slice(Math.min(next.match(/^\s*/)[0].length, indent + here[2].length + 1)) : next);
        }
        const li = document.createElement("li");
        li.append(markdown(body.join("\n"), depth + 1));
        // a single paragraph in an item is the item, not a paragraph inside one
        if (li.childNodes.length === 1 && li.firstChild.nodeName === "P") {
          li.replaceChildren(...li.firstChild.childNodes);
        }
        list.append(li);
        // a blank line between two items of one list does not end it
        while (at + 1 < lines.length && !lines[at].trim() && same(lines[at + 1])) at++;
      }
      out.append(list);
      continue;
    }
    // a paragraph, to a blank line or to the start of anything else
    const body = [l];
    for (at++; at < lines.length && lines[at].trim() && !starts(at); at++) body.push(lines[at]);
    const p = document.createElement("p");
    p.append(inline(body.join("\n")));
    out.append(p);
  }
  return out;
}

/**
 * The inside of a line: code, links, emphasis and escapes.
 *
 * note: `links` is off inside a link's own text, so an address written as the text of a link is
 * not made a second link inside the first.
 */
function inline(text, links = true) {
  const out = document.createDocumentFragment();
  let plain = "";
  const flush = () => { if (plain) out.append(document.createTextNode(plain)); plain = ""; };
  const wrapped = (tag, inner) => {
    flush();
    const el = document.createElement(tag);
    el.append(inline(inner, links));
    out.append(el);
  };
  // an underscore inside a word is part of the word - `snake_case` is not emphasis
  const word = (c) => c !== undefined && /[\p{L}\p{N}_]/u.test(c);
  const patterns = [
    [/\\([\\`*_{}\[\]()#+\-.!|~>])/y, (m) => { plain += m[1]; }],
    [/(`+)([\s\S]*?[^`])\1(?!`)/y, (m) => {
      flush();
      const el = document.createElement("code");
      const body = m[2];
      el.textContent = /^ .* $/.test(body) ? body.slice(1, -1) : body;
      out.append(el);
    }],
    [/\[([^\]]*)\]\(\s*<?([^)\s>]*)>?(?:\s+"[^"]*")?\s*\)/y, (m) => {
      if (!/^(https?:|mailto:)/i.test(m[2])) { wrapped("span", m[1]); return; }
      flush();
      out.append(link(m[2], inline(m[1], false)));
    }],
    // `<https://example.com>`, which markdown writes an address it means as a link
    [/<((?:https?:\/\/|mailto:)[^\s<>]+)>/iy, (m) => {
      if (!links) return false;
      flush();
      out.append(link(m[1]));
    }],
    // and an address with nothing around it, before the emphasis patterns, which would otherwise
    // read the underscores in one as emphasis. The length is the address's, without the
    // punctuation after it; see `address`
    [ADDRESS, (m) => {
      const length = links && address(text, m.index);
      if (!length) return false;
      flush();
      out.append(link(text.slice(m.index, m.index + length)));
      return length;
    }],
    [/\*\*(?=\S)([\s\S]*?\S)\*\*/y, (m) => wrapped("strong", m[1])],
    [/__(?=\S)([\s\S]*?\S)__(?![\p{L}\p{N}])/uy, (m, before) => word(before) ? false : wrapped("strong", m[1])],
    [/~~(?=\S)([\s\S]*?\S)~~/y, (m) => wrapped("del", m[1])],
    [/\*(?=[^\s*])([\s\S]*?[^\s*])\*/y, (m) => wrapped("em", m[1])],
    [/_(?=\S)([\s\S]*?\S)_(?![\p{L}\p{N}])/uy, (m, before) => word(before) ? false : wrapped("em", m[1])],
  ];
  let at = 0;
  next: while (at < text.length) {
    for (const [pattern, draw] of patterns) {
      pattern.lastIndex = at;
      const m = pattern.exec(text);
      const took = m && draw(m, text[at - 1]);
      if (m && took !== false) { at += typeof took === "number" ? took : m[0].length; continue next; }
    }
    plain += text[at++];
  }
  flush();
  return out;
}

/**
 * Ties the oldest line this page drew on sending to the item it turned out to be.
 *
 * note: what stops a message appearing twice. A line is drawn the moment it is sent, because a
 * message handed into a running turn is *queued* and does not become an item until that turn ends -
 * which can be minutes, and a page that waited would have swallowed it. But it does become one
 * eventually, and `context.added` is how everybody hears about it, so without this the page would
 * inspect its own message and draw it a second time underneath the first.
 *
 * note: claimed from either direction, because the order is not guaranteed. `replied` carries the
 * item a line was asked as and arrives on the command path; `context.added` arrives on the record
 * path; whichever gets here first binds, and the second finds it already bound.
 */
function claim(id) {
  if (mine.has(id)) return true;
  const el = pending.shift();
  if (!el) return false;
  mine.add(id);
  el.dataset.item = id;
  return true;
}

/** Asks what an item actually says, once, and leaves somewhere to put it. */
function inspect(id, kind) {
  if (wanted.has(id)) return;
  wanted.add(id);
  // a place for it, unless something on screen is already showing this item
  if (!log.querySelector(`[data-item="${id}"]`)) {
    say(kind, "…", id).classList.add("pending");
  }
  send({ do: "inspect", id });
}

/**
 * Moves to a view and draws it.
 *
 * note: it asks for a projection every time rather than drawing the one it has. The items can be
 * read out of the records - `context.added` names each as it arrives - but what the context view
 * is *for* is the columns that say what the next request will do with each of them, and those are
 * worked out by projecting rather than recorded by anything. A page that accumulated rows from
 * the stream would show a column that was right when the item arrived and has been wrong since.
 *
 * note: what it does not ask for is the conversation, even though the answer carries one. The chat
 * is drawn from the stream as it arrives and is already right; taking it from here as well would
 * be two accounts of one thing, and the projection's is the one that cannot show a model still
 * typing.
 */
function show(next) {
  showing = next;
  document.body.className = next;
  document.getElementById("view").textContent = next;
  draw();
  // every view but the chat is drawn from a projection, so every one of them asks for a fresh one
  // on the way in. The chat is the exception because the stream keeps it current; see `restale`
  if (next !== "chat") send({ do: "project" });
}

document.getElementById("view").onclick = () => {
  show(VIEWS[(VIEWS.indexOf(showing) + 1) % VIEWS.length]);
};

/**
 * The text size and the font, which are this browser's and nobody else's.
 *
 * note: kept in `localStorage` rather than sent to the session. A phone and a laptop looking at
 * one session want different sizes, and the terminal's font is the terminal emulator's, so there
 * is nothing on the session's side for a setting to mean. Every read and write is guarded: a
 * private window or blocked storage starts from the defaults and stays usable.
 *
 * note: the size is whole pixels from `SMALLEST` to `LARGEST`, and every other size on the page is
 * a share of it (see `--small` in the stylesheet), so the page keeps its proportions. The family
 * is a CSS font list; one typed by name goes first, with this page's monospace list after it for a
 * name this device does not have.
 */
const typeface = (() => {
  // the smallest keeps the header's text, a fifth smaller than the rest, from going below 10px
  const SIZE = 15, SMALLEST = 12, LARGEST = 28;
  const MONOSPACE = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  const KEYS = { size: "kamchatka.font.size", family: "kamchatka.font.family" };
  const saved = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const save = (key, value) => {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch { /* not kept, and still applied for as long as the page is open */ }
  };

  const button = document.getElementById("font");
  const panel = document.getElementById("fonts");
  const shown = document.getElementById("size");
  const family = document.getElementById("family");
  const named = document.getElementById("named");

  let size = Math.min(LARGEST, Math.max(SMALLEST, Number(saved(KEYS.size)) || SIZE));
  // what was chosen: one of the list's values, or a name typed under `other`
  let chosen = saved(KEYS.family) ?? "";

  // a name somebody typed, with nothing in it that could end the quotes it goes between or the
  // declaration it goes into. Kept as cleaned, so the box shows the name the page is using
  const clean = (name) => name.replace(/["'\\;{}<>]/g, "").trim();
  // cleaned again here, for a name read back from storage that this page did not write
  const quoted = (name) => `"${clean(name)}"`;
  const listed = () => [...family.options].some((option) => option.value === chosen);

  function apply() {
    const root = document.documentElement.style;
    root.setProperty("--size", `${size}px`);
    const custom = !listed();
    root.setProperty("--family", custom ? `${quoted(chosen)}, ${MONOSPACE}` : chosen || MONOSPACE);
    shown.textContent = `${size}px`;
    family.value = custom ? "other" : chosen;
    named.hidden = !custom;
    if (custom) named.value = chosen;
    // a context row's box is measured to its text, which has just changed size
    if (showing !== "chat") draw();
  }

  function open(on) {
    // under the header as tall as it is now, which the text size changes
    panel.style.top = `${document.querySelector("header").offsetHeight}px`;
    panel.hidden = !on;
    button.setAttribute("aria-expanded", String(on));
  }

  button.onclick = (e) => {
    e.stopPropagation();
    open(panel.hidden);
  };
  panel.onclick = (e) => e.stopPropagation();
  document.addEventListener("click", () => open(false));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !panel.hidden) {
      open(false);
      // an `esc` that closed the panel is spent, and does not also stop the turn
      e.preventDefault();
    }
  });

  for (const step of panel.querySelectorAll("[data-step]")) {
    step.onclick = () => {
      const by = Number(step.dataset.step);
      size = by === 0 ? SIZE : Math.min(LARGEST, Math.max(SMALLEST, size + by));
      save(KEYS.size, size === SIZE ? null : String(size));
      apply();
    };
  }
  family.onchange = () => {
    if (family.value === "other") {
      // the box opens empty and the page keeps its font until a name is typed into it
      named.hidden = false;
      named.value = "";
      named.focus();
      return;
    }
    chosen = family.value;
    save(KEYS.family, chosen || null);
    apply();
  };
  named.onchange = () => {
    chosen = clean(named.value);
    save(KEYS.family, chosen || null);
    apply();
  };

  return { apply };
})();
typeface.apply();

/** One row: a name, a line of figures under it, and a reason where there is one. */
/**
 * What colour a trace row's name is drawn in, as the terminal's trace tab draws it: a failure red,
 * a tool cyan, and a permission or a policy event the yellow of the question. `null` is the plain
 * text colour, which is what the rest are.
 *
 * note: a copy of the match in `ui/tabs.rs`, in the same order. Change both together.
 */
function traced(name) {
  if (name.endsWith(".failed")) return "failed";
  if (name.startsWith("tool")) return "tool";
  if (name.startsWith("permission") || name.startsWith("policy.")) return "asked";
  return null;
}

/**
 * A context row's box with a button beside it that copies what the box holds, `absent` from the
 * start where asked.
 *
 * note: what the box holds rather than a `/copy` of the item, so the reasoning and the text are
 * copied apart, and an edit somebody has typed but not let go of is copied as it stands. The click
 * is what lets a browser write to the clipboard, so this needs no round trip.
 */
function boxed(box, absent) {
  const wrap = document.createElement("div");
  wrap.className = absent ? "boxed absent" : "boxed";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.className = "copy";
  copy.textContent = "copy";
  copy.title = "copy what this box holds to this browser's clipboard";
  copy.onclick = async (e) => {
    // inside the row, which a tap would otherwise close
    e.stopPropagation();
    copy.textContent = (await toClipboard(box.value)) ? "copied" : "not copied";
    setTimeout(() => { copy.textContent = "copy"; }, 1500);
  };
  wrap.append(box, copy);
  return wrap;
}

/**
 * Sizes a context row's box to what it holds, up to the eight rows it starts at. Past that it
 * scrolls, and it can still be dragged taller.
 *
 * note: measured, so a long line that wraps counts as the lines it takes. A box in a closed row is
 * not drawn and has nothing to measure; it is fitted again when the row opens.
 */
function sized(box) {
  if (!box.offsetParent) return;
  box.style.height = "";
  const most = box.offsetHeight;
  box.style.height = "0px";
  // the border, which `scrollHeight` leaves out and a border-box height counts
  const need = box.scrollHeight + box.offsetHeight - box.clientHeight;
  box.style.height = `${Math.min(need, most)}px`;
}

function row(into, name, figures, why) {
  const el = document.createElement("div");
  el.className = "row";
  // the name and whatever control the row carries share a line, so the control keeps its place
  // when a path wraps to three of them
  const head = document.createElement("div");
  head.className = "head";
  const label = document.createElement("div");
  label.className = "name";
  label.textContent = name;
  head.append(label);
  el.append(head);
  if (figures) {
    const sub = document.createElement("div");
    sub.className = "figures";
    sub.textContent = figures;
    el.append(sub);
  }
  if (why) {
    const sub = document.createElement("div");
    sub.className = "why";
    sub.textContent = why;
    el.append(sub);
  }
  into.append(el);
  return el;
}

/**
 * Whichever panel is open, from the last projection; the chat is not one of them.
 *
 * note: held back while somebody is typing into an item, because the rebuild replaces every row
 * and would take the box with it - mid-sentence, and mid-edit. It is the bargain the chat already
 * strikes with a model that is still writing, and letting go of the box is what pays it. A
 * projection arrives for every state change in the session, so without this an edit on a phone
 * would last until the next one.
 */
function draw() {
  if (showing === "chat") return;
  const typing = document.activeElement;
  if (typing && typing.classList.contains("body")) {
    owed = true;
    return;
  }
  owed = false;
  const panel = document.getElementById("panel");
  panel.replaceChildren();
  if (!latest) return aside(panel, "nothing yet");

  if (showing === "context") {
    if (!latest.items.length) return aside(panel, "the context is empty");
    const rows = latest.items.filter(sifted);
    if (!rows.length) return aside(panel, "no row is left by the filter above");
    for (const item of rows) {
      // what it costs the request it is in, or why it is in none of it. The two are one answer:
      // every item is either going for some number of tokens or held back for a reason
      const held = item.going === null || item.going === undefined;
      const figures =
        `${item.kind} · ~${item.tokens.toLocaleString()} tokens · ${item.state}` +
        (held ? "" : ` · ${item.going.toLocaleString()} in the next request`) +
        (item.uncounted ? ` · ${item.uncounted} unpriced` : "");
      const el = row(panel, `${item.id} ${item.label}`, figures, item.left_out ?? item.marker);
      // which message this is, for rows that would otherwise all be called `user`
      if (item.glimpse) {
        const name = el.querySelector(".name");
        name.classList.add("glimpsed");
        name.textContent = `${item.id} ${item.label}:`;
        const glimpse = document.createElement("span");
        glimpse.className = "glimpse";
        glimpse.textContent = item.glimpse;
        glimpse.title = item.glimpse;
        name.append(glimpse);
      }

      // the state, and the way to change it. One button rather than three, because the session
      // owns the ring and what it writes beside each step - see `Command::Cycle`. What the button
      // says is where the item *is*, so a row reads as a fact and the tap is what changes it
      const state = document.createElement("button");
      state.type = "button";
      state.className = `state ${item.state}`;
      state.textContent = item.state;
      state.title = "the next state: active, pinned, elided, excluded";
      state.onclick = (e) => {
        // the row toggles its body and this is inside the row, so without this a tap that changes
        // a state also opens whatever it changed
        e.stopPropagation();
        // note: pinned is a step of this button's ring, right after active, because a page has no
        // `p` to press. The session's ring goes from active to elided, and from pinned to elided
        // too, so only the step into pinned is this page's own: the `/pin` a person would type.
        // The terminal's `space` keeps the session's ring, beside its own `p`
        if (item.state === "active") send({ do: "submit", line: `/pin ${item.id}` });
        else send({ do: "cycle", id: item.id });
      };
      el.querySelector(".head").append(state);

      // the row says what the item is; `inspect` is the only way to what it holds, because the
      // projection names items rather than carrying them
      el.classList.add("act");
      const body = document.createElement("textarea");
      body.className = "body";
      body.rows = 8;
      // what cannot be rewritten says so where somebody is about to type, rather than answering a
      // commit nobody was going to be allowed to make
      if (item.beyond) {
        body.readOnly = true;
        body.title = item.beyond;
      }
      // note: the parts a reply keeps beside its text, drawn around the box rather than in it.
      // The box is what an edit of the text is made of, and the reasoning is a part of the
      // context in its own right, edited in its own box with `revise_reasoning`. Hidden until an
      // answer says the item has them
      const said = document.createElement("div");
      said.className = "parts absent";
      said.textContent =
        item.reasoning_sent === false ? "reasoning · not sent back to the model" : "reasoning";
      const thought = document.createElement("textarea");
      thought.className = "body thought";
      thought.rows = 6;
      thought.dataset.thought = item.id;
      if (item.reasoning_beyond) {
        thought.readOnly = true;
        thought.title = item.reasoning_beyond;
      }
      const calls = document.createElement("div");
      calls.className = "parts calls absent";
      // each box with its own copy button, the reasoning's absent until an answer brings some
      el.append(said, boxed(thought, true), boxed(body, false), calls);
      // what the answer to this row's question says about the parts, kept here so the handler
      // can reach the row's own elements without knowing how the row is laid out
      thought.shown = (reasoning, called) => {
        said.classList.toggle("absent", reasoning === null);
        thought.parentElement.classList.toggle("absent", reasoning === null);
        thought.value = reasoning ?? "";
        thought.dataset.was = reasoning ?? "";
        sized(thought);
        calls.textContent = called.join("\n");
        calls.classList.toggle("absent", !called.length);
        // a turn that is only calls has no text, and an empty box that cannot be typed into
        // says nothing the calls under it do not
        body.parentElement.classList.toggle(
          "absent",
          body.readOnly && !body.value && called.length > 0,
        );
      };
      // note: `data-body` rather than `data-item`, which the chat uses for the line that *is* the
      // item. One `inspect` answer fills both, and a row opened here would otherwise overwrite
      // the chat's own line with the item's whole rendering
      // note: `raw`, because this box is the editor. What the chat asks for is the *reading* of
      // an item - the content with why it is here, what the turn was thinking and the calls it
      // carries above it - and committing that back would write `it is here because: …` into the
      // item it describes. See `Command::Inspect`
      //
      // note: which version the box is holding travels on the box, because two inspects can be
      // in flight at once - a thumb on the version button is faster than a round trip - and an
      // answer for `v1` filling a box that has moved on to `v2` would be the wrong words under
      // the right label. `data-at` is the question and the answer echoes it
      const total = item.versions + 1;
      let at = total;
      const fill = () => {
        const wire = at === total ? null : at;
        // note: the reading, not the text, for a turn recorded as ordered blocks and for anything
        // else no edit can be made of but a reply. The text of those is not what they hold - an
        // ordered turn's leaves out the thinking and calls among its blocks, and a file's is a
        // line standing in for it - and the box is read-only for them, so it can show what the
        // terminal's context tab shows. A reply that is only calls is asked for its text like any
        // other, and its reasoning and calls arrive beside it. An earlier version is still asked
        // for as text, because that is the only answer the session gives for one
        const reading =
          wire === null &&
          (item.ordered || (!!item.beyond && item.kind !== "assistant_message"));
        body.value = "…";
        sized(body);
        body.dataset.body = item.id;
        body.dataset.at = wire === null ? "" : String(wire);
        body.dataset.ask = reading ? "reading" : "raw";
        // an old version is read-only. Committing one would be a *restore* - a perfectly
        // reasonable thing to want, and not this button: somebody cycling to see what a message
        // used to say has not asked for it to say that again
        body.readOnly = !!item.beyond || at !== total;
        // and the reasoning of an old version for the same reason: the version is the whole
        // reply as it was, and is there to be read
        thought.readOnly = !!item.reasoning_beyond || at !== total;
        send({ do: "inspect", id: item.id, raw: !reading, version: wire });
      };

      // note: the way back through what an item used to say, and only on the items that have
      // one. `versions` counts the earlier ones, so what it says now is one past the last -
      // which is where this starts, because the current text is what somebody opening a row
      // means. Left of the state button: the state is what the row *is* and this is what it
      // *was*, so they read in the order the sentence has them
      if (item.versions) {
        const versions = document.createElement("button");
        versions.type = "button";
        versions.title = `${item.versions} earlier version(s); the last is what it says now`;
        const relabel = () => {
          versions.className = `versions${at === total ? "" : " past"}`;
          versions.textContent = `v${at}/${total}`;
        };
        relabel();
        versions.onclick = (e) => {
          // the row toggles its body and this is inside the row, the same as the state button
          e.stopPropagation();
          at = (at % total) + 1;
          relabel();
          // cycling is a thing to *read*, so it opens the row rather than leaving somebody to
          // open it themselves to find out what they just asked for
          el.classList.add("open");
          opened.add(item.id);
          fill();
        };
        el.querySelector(".head").insertBefore(versions, state);
      }
      // a row the reader had open is drawn open, and asked about again. Every projection rebuilds
      // this panel - an edit produces one itself - so a row that did not survive the rebuild would
      // close the moment it was saved, over the text it had just been given
      if (opened.has(item.id)) {
        el.classList.add("open");
        fill();
      }
      el.onclick = (e) => {
        // the row is the toggle and the box inside it is not: a tap on the text is somebody
        // reaching for the keyboard, and a row that collapsed under it would be a row nobody
        // could edit. Everything else about the row opens and closes it
        if (body.contains(e.target) || thought.contains(e.target)) return;
        if (el.classList.toggle("open")) opened.add(item.id);
        else opened.delete(item.id);
        // a box filled while its row was closed could not be measured then
        sized(body);
        sized(thought);
        if (body.value) return;
        fill();
      };
      // note: committed when the box is let go of rather than on every keystroke or behind a
      // button. A keystroke is not an edit - it would put a `context.replaced` in the log for
      // every letter - and a button is a control this page would have to find room for on a
      // phone, beside a box whose whole point is that it already looks like the thing it is.
      // Letting go is what the terminal's `enter` is: the moment somebody stopped typing
      //
      // note: against what arrived rather than against what is there now, because a session with
      // two clients can have rewritten this item while somebody was reading it. Sending what the
      // box holds when nothing in it was touched is how one client's stale copy quietly puts back
      // what the other just changed
      body.onblur = () => {
        const was = body.dataset.was;
        if (!body.readOnly && was !== undefined && body.value !== was) {
          body.dataset.was = body.value;
          send({ do: "revise", id: item.id, text: body.value });
        }
        // whatever the page held back while this had the focus. An edit answers with a projection
        // of its own, but a box let go of unchanged answers with nothing, and the rebuild it was
        // standing in front of is still owed
        if (owed) draw();
      };
      // and grows with what is typed into it, as far as the eight rows it starts at
      body.oninput = () => sized(body);
      thought.oninput = () => sized(thought);
      // the reasoning is committed the way the text is, and against what arrived for the same
      // reason. Emptying it takes the reasoning away, as `r` at the terminal does
      thought.onblur = () => {
        const was = thought.dataset.was;
        if (!thought.readOnly && was !== undefined && thought.value !== was) {
          thought.dataset.was = thought.value;
          send({ do: "revise_reasoning", id: item.id, text: thought.value });
        }
        if (owed) draw();
      };
    }
    return;
  }

  // the trace, which is the trace tab: the session's events in this program's own words. The
  // wording is the session's, because a second set written here would be a vocabulary nobody at
  // the other end could see
  if (showing === "events") {
    if (!latest.trace.length) return aside(panel, "nothing has happened yet");
    for (const event of latest.trace) {
      const when = new Date(event.at).toLocaleTimeString();
      // a line with no name is more of what the one above had to say, so it is drawn under it
      // rather than as an event of its own
      if (!event.name) {
        const more = document.createElement("div");
        more.className = "detail";
        more.textContent = event.detail;
        (panel.lastElementChild ?? panel).append(more);
        continue;
      }
      const el = row(panel, event.name, when, null);
      const kind = traced(event.name);
      if (kind) el.querySelector(".name").classList.add(kind);
      if (event.detail) {
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = event.detail;
        el.append(detail);
      }
    }
    panel.scrollTop = panel.scrollHeight;
    return;
  }

  // note: named rather than left as a fall-through. A view this does not know about is a bug, and
  // drawing the permissions at it is the kind that looks like a feature
  if (showing !== "permissions") return;

  // what is deciding, and what it does with everything the list does not mention - above the list,
  // always, which is where the tab puts it. A list of decisions is not a policy: drawn alone, the
  // rows leave somebody who allowed one `ls` looking at an empty table and no answer to why the
  // model has just run one
  const policy = document.createElement("p");
  policy.className = "policy";
  policy.append(document.createTextNode(`${latest.policy} · anything it has not been told about: `));
  const untold = document.createElement("span");
  untold.className = verdicts[latest.untold] ?? "asks";
  untold.textContent = latest.untold;
  policy.append(untold);
  panel.append(policy);

  // a heading over each of the two lists, as on the tab
  const rules = document.createElement("p");
  rules.className = "section";
  rules.textContent = "the rules";
  panel.append(rules);

  // the decided rows, or every row once the footer's `toggle` lists what it asks about as well, as
  // the tab's `s` does. A session older than the full list sends none, and gets no toggle
  const listed = asksShown && latest.all_permissions?.length
    ? latest.all_permissions
    : latest.permissions;
  if (!listed.length) {
    aside(
      panel,
      "nothing has been decided yet, so everything is asked about - an empty list does not " +
        "mean anything is allowed.\n\nAnswer a question `always` to add a rule here, where it " +
        "can be changed later. A few paths that usually hold credentials are always asked about " +
        "by the file tools, even once their capability is allowed. Those don't apply to shell " +
        "commands, which the sandbox below limits instead.",
    );
  }
  for (const rule of listed) {
    // note: `covers:` where the tab has a column header saying so. A rule about one tool is
    // usually named for it, and without the word the row read `fs:read` twice
    const covers = rule.tools.length
      ? `covers: ${rule.tools.join(", ")}`
      : "nothing registered needs it";
    const sometimes = rule.sometimes.length ? ` · sometimes ${rule.sometimes.join(", ")}` : "";
    const el = row(panel, rule.subject, `${covers}${sometimes}`);
    // note: the three the tab's `a`, `r` and `n` give, with the one the row has pressed in. `ask`
    // is the way back from an `always`: the row leaves the list, since a question is not a
    // decision, and the session answers with the list as it now stands - see `Command::Rule`
    const answers = document.createElement("div");
    answers.className = "rules";
    for (const verdict of ["allow", "ask", "deny"]) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = verdict;
      button.className = verdicts[verdict];
      const held = rule.verdict === verdict;
      button.setAttribute("aria-pressed", String(held));
      button.disabled = held;
      button.onclick = () => send({ do: "rule", subject: rule.subject, verdict });
      answers.append(button);
    }
    el.querySelector(".head").append(answers);
  }

  // the sandbox, under the rules as on the tab: whether it holds the shell in its heading, then
  // its parts under the kind each is about. How open a part is goes where a rule's buttons go, in
  // the same colours; the rule that decides it is named rather than given buttons of its own,
  // since its own row is where it is changed
  const sandbox = latest.sandbox;
  if (sandbox) {
    const heading = document.createElement("p");
    heading.className = "section apart";
    heading.append(document.createTextNode("the sandbox · "));
    const status = document.createElement("span");
    status.className = verdicts[sandbox.tone] ?? "";
    status.textContent = sandbox.status;
    heading.append(status);
    const says = document.createElement("span");
    says.className = "says";
    says.textContent = ` · ${sandbox.says}`;
    heading.append(says);
    panel.append(heading);
    if (sandbox.note) aside(panel, sandbox.note);

    let kind = null;
    for (const part of sandbox.parts) {
      if (part.kind !== kind) {
        kind = part.kind;
        const label = document.createElement("p");
        label.className = "kind";
        label.textContent = kind;
        panel.append(label);
      }
      const by = part.rule ? ` · set by ${part.rule}` : "";
      const el = row(panel, part.name, `${part.says}${by}`);
      if (part.access) {
        const access = document.createElement("span");
        access.className = `access ${verdicts[part.tone] ?? ""}`;
        access.textContent = part.access;
        el.querySelector(".head").append(access);
      }
      if (part.paths.length) {
        const paths = document.createElement("details");
        paths.className = "paths";
        // kept open across the redraw every projection makes, or a list somebody opened would
        // close again the moment anything in the session moved
        paths.open = openedParts.has(part.name);
        paths.ontoggle = () => {
          if (paths.open) openedParts.add(part.name);
          else openedParts.delete(part.name);
        };
        const summary = document.createElement("summary");
        // the count is in the sentence above; this only says what opening it does
        summary.textContent = "show";
        paths.append(summary);
        for (const path of part.paths) {
          const line = document.createElement("div");
          line.textContent = path;
          paths.append(line);
        }
        el.append(paths);
      }
    }
  }

  // and the footer the tab has, in the tab's order. The sandbox line is there only where no sandbox
  // is listed above to say it in its heading: a registered shell that has not been refused can
  // read, write and reach the network whatever the rows say, so a list of verdicts with nothing
  // about it would be reporting restrictions that are not there. The count says that the rows are
  // the decisions rather than the whole policy
  const footer = latest.sandbox
    ? []
    : [latest.confinement ?? "no sandbox: a command reaches whatever this user can"];
  const toggles = latest.undecided > 0 && latest.all_permissions?.length > 0;
  if (latest.undecided) {
    footer.push(
