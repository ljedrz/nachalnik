[package]
name = "kamchatka"
version = "0.13.0"
description = "A terminal LLM agent built on nachalnik: the context, the budget and every decision, on screen."
documentation = "https://docs.rs/kamchatka"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
# `tui` rather than `terminal` as well: they are near-duplicates, and the slot buys `ai`, which
# is where the people who want this actually look
keywords = ["agent", "llm", "ai", "tui", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
name = "kamchatka"
path = "src/lib.rs"

[[bin]]
name = "kamchatka"
path = "src/main.rs"

[features]
default = ["mcp", "tui"]
# `--advise` asks TypeSafe's `jev` for a second opinion on a tool call the standing rules were
# going to allow, and folds it in with `Verdict::strictest` so that it can only ever tighten.
#
# note: optional, and deliberately not in `default`. It is the one thing in this program that
# sends a tool's *arguments* to a third party - which for a write is the text being written -
# and that is a decision somebody has to make rather than inherit from a build. See
# `tools::advice`, which is where the whole of what leaves the machine is written down.
advise = ["nachalnik-providers/system1"]
# the same advisor, asked a different question: where a `shell` command lands on a three-level
# rubric, drawn in the permission question in green, yellow or red so that somebody deciding
# whether to press `y` can see at a glance what they are being asked about. A command joined at
# its `|`, `&&` or `;` is placed stage by stage - every stage a question in the one request - and
# rated by the worst of them, with that stage underlined in the command itself.
#
# note: on top of `advise` rather than beside it, and a second opt-in rather than part of the
# first, because it widens what leaves the machine in a way the first one's note does not cover.
# `advise` sends only calls the standing rules were going to *allow*; this sends the ones they
# were going to *ask about*, which in a default session is every command the model writes. That
# is the disclosure somebody has to agree to separately - see `tools::advice`.
#
# note: it decides nothing. The rating is drawn and is never folded into a verdict, so a session
# with this on refuses and allows exactly what the same session without it would.
assisted-shell = ["advise"]
# `--mcp 'cmd args'` puts somebody else's MCP server's tools in the same list as the built-in
# ones. Optional because the runtime does not need it and neither does the terminal.
mcp = ["dep:nachalnik-mcp"]
# the screen and the keys: `ui`, the prompt, and the bindings that drive them. Optional because
# `App` is the program and drawing it is one caller - the six dependencies below are wanted by
# nothing else in here, and a session driven by anything but a person at a terminal pays for none
# of them
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:ratatui-textarea",
    "dep:synoptic",
    "dep:tui-markdown",
    "dep:unicode-segmentation",
    "dep:unicode-width",
]

[dependencies]
nachalnik = { workspace = true, features = ["selectors"] }
nachalnik-mcp = { workspace = true, optional = true }
# both dialects: `--gemini` picks between them at startup, and the whole point of the second one
# is that nothing above the trait finds out which it got
nachalnik-providers = { workspace = true, features = ["gemini"] }

parking_lot.workspace = true
# `--serve` and `--connect` over a port: see `remote::tuned` for what the two options are for and
# why neither of them matters until the socket stops being a loopback one
socket2.workspace = true
# `derive` for the settings file, which is the one thing here with a shape somebody else writes
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "fs",
    # `io-std` for the headless loop's stdin, which has to be selected on alongside the kernel's
    # events rather than read from a thread of its own
    "io-std",
    "io-util",
    "macros",
    # `--serve` and `--connect`: a unix socket where there are any and a loopback port where there
    # are not. With `socket2` above, which is one method on a port, that is the whole of what
    # remote control costs - which is why `remote` is not behind a feature of its own the way `tui`
    # and `mcp` are: those exist to keep six dependencies and a bridge out of a build that wants
    # neither, and a crate `tokio` already builds is nothing to keep out. The other half of the
    # decision is that a build with no screen is exactly the build a served session runs in
    "net",
    "process",
    "rt-multi-thread",
    # `ctrl+c` in a headless run means "stop, and keep what arrived" rather than the default,
    # which is to kill the process and everything it had not written yet
    "signal",
    "time",
] }

anyhow = "1"
# `/attach` reads a file off the disk and `Content::Blob` holds its payload already encoded, so
# something here has to do the encoding. Hand-rolling a codec in the one place that decides what
# bytes a paid endpoint is charged for is not a trade worth making for forty lines
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# ripgrep's own engine, which is what `grep` and `glob` are made of: `grep-searcher` is the search
# loop (line buffering, binary detection, context lines), `grep-regex` the matcher, `ignore` the
# walker that knows what a `.gitignore` means, and `globset` the patterns both tools filter with.
# Four crates rather than a search written here, and rather than running `rg`: the binary is these
# libraries plus a printer, so linking them needs no `rg` on the machine and no second
# process-spawning path for the sandbox to cover. The printer is the half this program wants of
# its own - one that cuts at matches and says how many it did not show
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
# `event-stream` so that the terminal's keys arrive as a `Stream` and can be selected on
# alongside the kernel's events; the same crossterm `ratatui` is built against
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
# three of the five defaults. `macros` is out because `ui` builds its layout from calls rather
# than from a declaration, and `all-widgets` because its only member is the calendar. LTO drops
# both from the binary either way, so what this buys is a crate fewer to compile and a manifest
# that says which widgets the program is made of
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    # the solved layout is kept across frames, and `ui` redraws the whole screen on every tick
    "layout-cache",
    "underline-color",
], optional = true }
# the editing an input line is expected to do - words, selection, undo, paste - which is not
# something this crate should be writing
ratatui-textarea = { version = "0.9", optional = true }
# models answer in markdown, and a terminal that showed the asterisks would be showing the
# punctuation instead of the emphasis. `default-features = false` leaves out its syntect-based
# highlighting, which is done here instead - see `synoptic` below for why
tui-markdown = { version = "0.3", default-features = false, optional = true }
# fenced code blocks, coloured by token *name* - `comment`, `string`, `keyword` - which is what
# lets the palette be this program's own. `default-features = false` on `tui-markdown` above is
# the other half of that decision: its `highlight-code` feature is syntect, whose themes are
# 24-bit colour chosen against a known background, and which drops the marker that tells this
# program a line is code at all
synoptic = { version = "2.2", optional = true }

tokio-stream = "0.1"
# the local offset from UTC, asked once at startup, and the calendar behind the clock on every
# trace line. Not optional, because what a line says about itself is what a search over the trace
# matches on - so the stamp has to be built where the filtering is, which is `app`, not `ui`.
# `ratatui-widgets` already builds this for a screen build; a headless one now pays for it too,
# which is the price of the two panes agreeing about what an event says
time = { version = "0.3", features = ["local-offset"] }
# the fuzzy matcher behind `/` on the context and trace panes - Helix's, which is where the
# expectation of what "fuzzy" feels like comes from. The matcher alone rather than `nucleo`: the
# full crate brings a worker pool and an injector for streaming millions of candidates into a
# picker, and what is being filtered here is a few hundred rows already in memory
nucleo-matcher = "0.3"
# the prompt box has to be as tall as its wrapped text, and `ratatui-textarea` wraps when it draws
# without reporting how many rows that came to. `ui::wrapped_rows` counts them, and counting them
# the same way means breaking where it breaks: at unicode word bounds, which is why `/` in a long
# path is a break and a plain search for spaces is not enough
unicode-segmentation = { version = "1.13", optional = true }
# a character is not a column. `ui::text::columns` is the one place this is asked, and everything
# that decides what fits goes through it - a terminal gives a CJK character two cells and an
# emoji two, so measuring in characters fits twice as much on a row as there is room for and the
# overflow is clipped at the right edge by a widget that does not wrap. `ratatui` already builds
# this for `Span::width`, so naming it here costs a line and no compile time
unicode-width = { version = "0.2", optional = true }

# the sandbox the `shell` tool runs under. Landlock is a Linux LSM a process applies to *itself* -
# no privileges, no setuid helper, no container - which is what makes it small enough to belong in
# a demonstration and strong enough that `network: deny` is refused by the kernel rather than by a
# policy reading the word `curl`
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# using TypeSafe's `jev` to decide what a full context can afford to lose, against the age order
# `Trim` really uses. Nothing in the crate does this - it is here to be read and run by somebody
# wondering what a System One model is for. It wants a real endpoint, so it rides on the feature
# that brings that client in
[[example]]
name = "jev_assisted_compaction"
path = "examples/jev_assisted_compaction.rs"
required-features = ["advise"]

# some of the suites are the terminal's: they draw a frame and read the characters back, or press a
# key to get at a verb. The rest - the policy's own questions, real commands under a real ruleset,
# the introspection tools through the real loop, and a whole session driven by lines rather
# than keys - are about the program rather than the screen, so `cargo test --no-default-features`
# runs them instead of failing to compile them
[[test]]
name = "advise"
path = "tests/advise.rs"
required-features = ["advise"]

[[test]]
name = "edges"
path = "tests/edges.rs"
required-features = ["tui"]

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["tui"]

# and one that is neither: a server spawned by `--mcp`, under a run with no screen. It wants the
# feature that offers the flag and nothing else, so a build with the tools and no terminal runs it
[[test]]
name = "mcp"
path = "tests/mcp.rs"
required-features = ["mcp"]

[[test]]
name = "screen"
path = "tests/screen/main.rs"
required-features = ["tui"]

[dev-dependencies]
# the chat-against-the-request property in `tests/screen/chat.rs`, where the sequence of moves is
# generated and the shrinker is what makes a failure readable
proptest = { workspace = true }
# the screen is tested by drawing it: a scripted provider answers, and the frame that comes out
# is asserted against
nachalnik = { workspace = true, features = ["selectors", "test"] }
# `net` for the one test that needs a real socket: an endpoint that lists what its model takes,
# which is where the status line's parameter row comes from
tokio = { workspace = true, features = ["net"] }
