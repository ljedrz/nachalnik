[package]
name = "kamchatka"
version = "0.19.1"
description = "A terminal LLM agent for Linux, built on nachalnik: the context, the budget and every decision, on screen."
documentation = "https://docs.rs/kamchatka"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
# `tui` but not also `terminal`, which is nearly the same; the slot goes to `ai` instead
keywords = ["agent", "llm", "ai", "tui", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
# the README links its screenshots by URL, so the package doesn't need them
exclude = ["assets/"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "kamchatka"
path = "src/lib.rs"

[[bin]]
name = "kamchatka"
path = "src/main.rs"

[features]
default = ["mcp", "tui", "webui"]
# a client for System One models (`endpoint::advise`), which answer typed questions with
# probabilities instead of writing text: the ones OpenRouter serves, or a compatible server of your
# own. On its own it changes nothing in the program; `shell-advisor` uses it, and so does the
# `system1_assisted_compaction` example.
advise = ["nachalnik-providers/system1"]
# `--advise`: the advisor rates each `shell` command you're asked about on a three-level scale,
# shown as green, yellow or red in the permission question. A command chained with `|`, `&&` or
# `;` is rated stage by stage, in one request, and gets the worst stage's rating, with that stage
# underlined.
#
# note: the rating is only displayed. It never affects what is allowed or refused, and commands
# you've allowed run without being rated.
#
# note: not in `default`, because it sends commands to a third party: in a default session, every
# command the model writes, since `exec:run` asks by default. That should be a deliberate choice.
# `tools::advice` lists exactly what is sent.
shell-advisor = ["advise"]
# `--mcp 'cmd args'` adds an MCP server's tools alongside the built-in ones.
mcp = ["dep:nachalnik-mcp"]
# `--web`: serves the session as a web page. No extra dependencies: the HTTP handling uses the
# sockets `--serve` already needs, and the page is one embedded file. No authentication: it
# listens on loopback, or on a private-network address with a warning; see `web`.
webui = []
# the terminal interface: `ui`, the prompt, and the key bindings. Optional so that headless and
# served builds don't compile the dependencies below, which nothing else uses
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:ratatui-textarea",
    "dep:synoptic",
    "dep:tokio-stream",
    "dep:tui-markdown",
    "dep:unicode-segmentation",
    "dep:unicode-width",
]

[dependencies]
nachalnik = { workspace = true, features = ["selectors"] }
nachalnik-mcp = { workspace = true, optional = true }
# every API: `--gemini`, `--anthropic` and `--responses` choose one at startup, and the rest of
# the program doesn't need to know which
nachalnik-providers = { workspace = true, features = ["anthropic", "gemini"] }

parking_lot.workspace = true
# TCP options for `--serve` and `--connect` over a port; see `remote::tuned`
socket2.workspace = true
# `derive` for the settings file
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = [
    "fs",
    # `io-std` for reading stdin in headless mode alongside the kernel's events
    "io-std",
    "io-util",
    "macros",
    # `--serve` and `--connect`, over a unix socket or a loopback port. Together with `socket2`,
    # that is all remote control costs, so `remote` has no feature of its own; besides, builds
    # without a screen are exactly the ones that serve sessions
    "net",
    "process",
    "rt-multi-thread",
    # so that `ctrl+c` in a headless run stops and keeps what arrived, instead of killing the
    # process before it writes anything
    "signal",
    "time",
] }

anyhow = "1.0.46"
# `/attach` reads files, and `Content::Blob` stores them already encoded. Not hand-rolled, since a
# bug here would change what a paid endpoint charges for
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
# ripgrep's libraries, used by the `grep` and `glob` tools: `grep-searcher` (line buffering, binary
# detection, context lines), `grep-regex` (matching), `ignore` (directory walking that respects
# `.gitignore`) and `globset` (patterns). Linking them instead of running `rg` means `rg` needn't
# be installed and the sandbox has no extra process to cover. The output formatting is our own, so
# it can cut long results and say how much was left out
globset = "0.4.18"
grep-regex = "0.1"
grep-searcher = "0.1.4"
ignore = "0.4.15"
# `event-stream` so key presses arrive as a `Stream` alongside the kernel's events; the same
# version `ratatui` uses
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
# three of the five default features: `macros` isn't used, and `all-widgets` only adds a calendar.
# LTO would remove them from the binary anyway; this saves compiling a crate
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    # the solved layout is kept across frames, and `ui` redraws the whole screen on every tick
    "layout-cache",
    "underline-color",
], optional = true }
# text editing for the prompt: word movement, selection, undo, paste
ratatui-textarea = { version = "0.9", optional = true }
# renders the models' markdown answers. `default-features = false` leaves out its syntect-based
# code highlighting; we use `synoptic` instead (see below)
tui-markdown = { version = "0.3.9", default-features = false, optional = true }
# highlights code blocks by token type (`comment`, `string`, `keyword`), so we can use our own
# colours. syntect, used by `tui-markdown`'s `highlight-code`, has 24-bit themes made for a known
# background, and drops the marker that tells us a line is code
synoptic = { version = "2.2", optional = true }

# `next()` on the terminal's key stream, so only needed with a screen
tokio-stream = { version = "0.1.1", optional = true }
# the local UTC offset (read once at startup) and the timestamps on trace lines. Not optional:
# searching the trace matches on the timestamp, so it is built in `app`, not `ui`. Screen builds
# already have it through `ratatui-widgets`
time = { version = "0.3.47", features = ["local-offset"] }
# fuzzy matching for `/` on the context and trace panes, from Helix. Just the matcher, not
# `nucleo`, whose worker pool is built for millions of items; we filter a few hundred
nucleo-matcher = "0.3"
# the prompt box must be as tall as its wrapped text, but `ratatui-textarea` doesn't report how
# many rows it wraps to. `ui::wrapped_rows` counts them by breaking at the same unicode word
# boundaries (which include `/`, so splitting on spaces isn't enough)
unicode-segmentation = { version = "1.13.2", optional = true }
# terminal column widths, since CJK characters and emoji take two cells. Used through
# `ui::text::columns`; `ratatui` already depends on it
unicode-width = { version = "0.2", optional = true }

# the sandbox for the `shell` tool. Landlock is a Linux security module a process applies to
# itself, with no privileges, setuid helper or container, and the kernel enforces it.
#
# note: in a target table even though the crate only builds for Linux, so other targets reach the
# `compile_error!` in `lib.rs`, which explains why, instead of failing inside these crates
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# raw system calls for `gate`, which pauses a sandboxed command's attempt to open an internet socket
# until you answer: `seccomp(2)` and its notification `ioctl`s, which no crate wraps safely without
# linking the C `libseccomp`. Already a dependency of `tokio` and `landlock`
libc = "0.2.187"
# `openat2` with `RESOLVE_BENEATH`, which `std` lacks, so a path the file tools checked can't be
# swapped for a symlink before it's opened. `net` and `event` for the gate's socket pair and
# polling; `process` for the `setsid` that detaches sandboxed commands from the terminal. Screen
# builds already have it through `crossterm`
rustix = { version = "1", features = ["event", "fs", "net", "process"] }

[[example]]
name = "gateway"
path = "examples/gateway.rs"
required-features = ["webui"]

# uses a System One model to choose what to drop from a full context, compared with the age order
# `ToolTrimmer` uses. The program doesn't do this; it shows what System One models can be used for
[[example]]
name = "system1_assisted_compaction"
path = "examples/system1_assisted_compaction.rs"
required-features = ["advise"]

# the test suites that need the screen (drawing frames, pressing keys) or another feature say so,
# so `cargo test --no-default-features` runs the rest instead of failing to compile
[[test]]
name = "advise"
path = "tests/advise.rs"
required-features = ["shell-advisor"]

[[test]]
name = "edges"
path = "tests/edges.rs"
required-features = ["tui"]

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["tui"]

# an MCP server started by `--mcp`, in a headless run, so it only needs `mcp`
[[test]]
name = "mcp"
path = "tests/mcp.rs"
required-features = ["mcp"]

[[test]]
name = "screen"
path = "tests/screen/main.rs"
required-features = ["tui"]

[dev-dependencies]
# the property test in `tests/screen/chat.rs` that checks the chat against the request
proptest = { workspace = true }
# a scripted provider for the screen tests, which draw frames and check them
nachalnik = { workspace = true, features = ["selectors", "test"] }
# `net` for the test that serves a model listing (for the status line's parameters); `test-util`
# for a paused clock, so a client's one-minute reconnect timeout passes instantly
tokio = { workspace = true, features = ["net", "test-util"] }
