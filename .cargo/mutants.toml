# Mutants that `cargo mutants` never generates in this repository, because they are dangerous to
# run.
#
# `Stragglers::call_of` decides which processes are stopped when a session ends. Mutating it to
# match every process (`Some(_)`) or every other session's processes (`!=`) makes a test kill
# everything the user is running, including the desktop. The tests use the same signal scope as a
# session, which prevents this on Linux 6.12 and later; this exclusion covers older kernels.
#
# `Sandbox::argv` builds the arguments `--confine-and-run` takes, which the sandbox tests run the
# program with. If it is empty or a single empty argument, each of those tests starts a whole
# session instead of confining one command. When sessions still ran their commands this way, that
# grew to 14601 processes in a few minutes; it stays excluded rather than finding out again.
#
# `empty` in `sandbox/confinement.rs` empties a command's temporary directory, opening up each
# directory in it, and skips `.` and `..` by name. A mutant of that skip lets it into `..`, and it
# climbs: it opens up each directory above the temporary one, unlinks every file in it and in the
# directories beside the ones it came up through. It did so from a mutants worktree up through the
# whole repository in a run, `.git` included, and stopped only where the session running it could
# not write.
exclude_re = [
    'replace Stragglers::call_of -> Option<usize> with Some',
    'replace == with != in Stragglers::call_of',
    'replace Sandbox::argv -> Vec<OsString> with',
    'sandbox/confinement\.rs:\d+:\d+: replace (\|\| with &&|== with !=) in empty$',
]
