[package]
name = "nachalnik-providers"
version = "0.9.1"
description = "Providers for the nachalnik agent runtime: the OpenAI chat-completions, Gemini and Anthropic dialects, streamed, retried and interruptible - and a client for System One models, which answer typed questions instead of turns."
documentation = "https://docs.rs/nachalnik-providers"
readme = "README.md"
# `web-programming::http-client` because it is a client for other services' HTTP APIs
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
keywords = ["provider", "agent", "llm", "ai", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["openai"]
# The OpenAI chat-completions API (`/chat/completions`, `choices[].delta`, tool calls assembled
# from fragments), which OpenRouter, ollama, vLLM, Together and most others implement. Also
# OpenAI's Responses API, which returns a reasoning model's thinking in encrypted form.
openai = []
# Google's own `generateContent` API: `candidates[].content.parts`, whole tool calls, and ordered
# `thought` parts. `nachalnik`'s `Content::Blocks` was designed around it.
gemini = []
# Anthropic's Messages API: `/messages`, typed content blocks, `input_json_delta` fragments and
# signed thinking blocks. Served by `api.anthropic.com`, and by OpenRouter at `/api/v1/messages`.
anthropic = []
# A client for System One models, which answer typed questions about a state with probabilities,
# at `POST /systemone`: the ones OpenRouter serves, or your own server. Unlike the others it is not
# a `Dialect`: it generates no text and calls no tools, so it isn't a `Provider` and its answers
# never reach a kernel. Providers OpenRouter doesn't list are reached through OpenRouter's
# bring-your-own-key, not through separate code here.
system1 = []
# The test suite every dialect above must pass, for anyone writing a new one. It opens real
# sockets and needs `nachalnik/test`, so it's off by default and meant for dev-dependencies.
conformance = ["nachalnik/test", "tokio/io-util", "tokio/net", "tokio/rt"]

[dependencies]
nachalnik.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
# note: the library only needs `time`, for deadlines and backoff; `conformance` adds `rt` itself
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
nachalnik = { workspace = true, features = ["test"] }
# `net` and `io-util` for tests that need real sockets (a server that goes silent after answering,
# and one that cuts a stream at a chosen byte), which can't be mocked. `test-util` for a paused
# clock, so timeouts don't take their real fifteen seconds
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
