[package]
name = "nachalnik-providers"
version = "0.4.0"
description = "Providers for the nachalnik agent runtime: the OpenAI chat-completions and Gemini dialects, streamed, retried and interruptible - and a System One client for TypeSafe's jev, which answers typed questions instead of turns."
documentation = "https://docs.rs/nachalnik-providers"
readme = "README.md"
# `web-programming::http-client` because that is the whole of what this is: somebody else's HTTP
# API, read carefully
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
keywords = ["provider", "agent", "llm", "ai", "nachalnik"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["openai"]
# The OpenAI chat-completions dialect: `/chat/completions`, `choices[].delta`, tool calls
# assembled from fragments. What OpenRouter, ollama, vLLM, Together and most of the rest speak.
openai = []
# Google's own `generateContent`: `candidates[].content.parts`, whole calls, and ordered
# `thought` parts - the dialect `nachalnik`'s `Content::Blocks` was built for.
gemini = []
# System One models - typed questions put to a state, answered with probabilities - of which
# this speaks to TypeSafe's `jev` at `POST /systemone`. The one thing in here that is not a
# `Dialect`, because it generates no text and calls no tools - so it implements no `Provider` and
# nothing it returns reaches a kernel. Named for the category rather than the vendor: the three
# question types are the category's, and a second engine would be a second struct in the module.
system1 = []
# The suite the two above are held to, for anyone writing a third. It stands up real sockets and
# wants `nachalnik/test`, so it is off unless asked for - a dev-dependency's feature, not a
# dependency's.
conformance = ["nachalnik/test", "tokio/io-util", "tokio/net"]

[dependencies]
nachalnik.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
nachalnik = { workspace = true, features = ["test"] }
# `net` and `io-util` for the tests that need a real socket: a server that answers and then says
# nothing, and one that breaks a stream at a chosen byte. Neither shape can be mocked
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
